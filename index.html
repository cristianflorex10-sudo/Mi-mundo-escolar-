     * BASE DE DATOS PERSISTENTE Y AISLAMIENTO POR USUARIO (STORAGE ENGINE)
     * ============================================================================
     */
    const DB_KEY = 'mi_mundo_escolar_db_v1';

    function loadDB() {
      try {
        const raw = localStorage.getItem(DB_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (!parsed.schedules) parsed.schedules = JSON.parse(JSON.stringify(INITIAL_OFFICIAL_SCHEDULES));
          if (!parsed.users) parsed.users = [];
          if (!parsed.tasks) parsed.tasks = [];
          if (!parsed.reminders) parsed.reminders = [];
          if (!parsed.studySessions) parsed.studySessions = [];
          if (!parsed.pomodoroLogs) parsed.pomodoroLogs = [];
          if (!parsed.goals) parsed.goals = [];
          if (!parsed.events) parsed.events = [];
          if (!parsed.notifications) parsed.notifications = [];
          if (!parsed.syncQueue) parsed.syncQueue = [];
          return parsed;
        }
      } catch (e) {
        console.error('Error leyendo base de datos local:', e);
      }
      const initial = {
        schedules: JSON.parse(JSON.stringify(INITIAL_OFFICIAL_SCHEDULES)),
        users: [],
        tasks: [],
        reminders: [],
        studySessions: [],
        pomodoroLogs: [],
        goals: [],
        events: [],
        notifications: [],
        syncQueue: []
      };
      saveDB(initial);
      return initial;
    }

    function saveDB(db) {
      try {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
        return true;
      } catch (e) {
        showToast('Error al guardar en almacenamiento local: ' + e.message, 'error');
        return false;
      }
    }

    /**
     * ============================================================================
     * MOTOR DE SONIDO REAL (WEB AUDIO API)
     * ============================================================================
     */
    const SoundEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      },
      play(type = 'campana', volume = 0.7) {
        try {
          this.init();
          if (!this.ctx) return false;
          const now = this.ctx.currentTime;
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(Math.max(0.01, Math.min(1, volume)), now);
          gain.connect(this.ctx.destination);

          if (type === 'campana') {
            // Doble timbre escolar claro
            [880, 1174.66].forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + i * 0.16);
              g.gain.setValueAtTime(volume * 0.6, now + i * 0.16);
              g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.16 + 0.55);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(now + i * 0.16);
              osc.stop(now + i * 0.16 + 0.6);
            });
          } else if (type === 'acorde') {
            // Acorde positivo de estudio
            [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + i * 0.08);
              g.gain.setValueAtTime(volume * 0.45, now + i * 0.08);
              g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.65);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(now + i * 0.08);
              osc.stop(now + i * 0.08 + 0.7);
            });
          } else if (type === 'urgente') {
            // Alerta de vencimiento / retraso
            [987.77, 783.99, 987.77].forEach((freq, i) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + i * 0.18);
              g.gain.setValueAtTime(volume * 0.65, now + i * 0.18);
              g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.18 + 0.25);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(now + i * 0.18);
              osc.stop(now + i * 0.18 + 0.28);
            });
          }
          return true;
        } catch (e) {
          return false;
        }
      }
    };

      taskFilterSubject: 'todas',

    };

    function getTodayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset();
      const local = new Date(now.getTime() - offset * 60000);
      return local.toISOString().split('T')[0];
    }

    function getTodayDayName() {
      const idx = new Date().getDay(); // 0=Dom, 1=Lun ... 6=Sab
      const map = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      return DAYS.includes(map[idx]) ? map[idx] : 'Lunes';
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message, type = 'success') {
      const id = 'toast_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      state.toasts.push({ id, message, type });
      renderToasts();
      setTimeout(() => {
        state.toasts = state.toasts.filter(t => t.id !== id);
        renderToasts();
      }, 4200);
    }

    function renderToasts() {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 max-w-sm w-full px-4 sm:px-0 pointer-events-none';
        document.body.appendChild(container);
      }
      container.innerHTML = state.toasts.map(t => {
        const styles = t.type === 'error'
          ? 'bg-rose-900 text-white border-rose-700'
          : t.type === 'warning'
            ? 'bg-amber-900 text-white border-amber-700'
            : 'bg-slate-900 text-white border-slate-700';
        const icon = t.type === 'error' ? '⚠️' : t.type === 'warning' ? '🔔' : '✅';
        return `
          <div class="pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-xl border shadow-lg text-sm font-medium ${styles} animate-fade-in">
            <span>${icon}</span>
            <span class="flex-1 leading-snug">${escapeHTML(t.message)}</span>
          </div>
        `;
      }).join('');
    }

    /**
     * ============================================================================
     * HELPERS DE USUARIO Y HORARIOS OFICIALES
     * ============================================================================
     */
    function getCurrentUser() {
      if (!state.currentUserId) return null;
      return state.db.users.find(u => u.id === state.currentUserId) || null;
    }

    function getUserSchedule(user) {
      if (!user) return {};
      const key = `${user.curso}-${user.paralelo}`;
      return state.db.schedules[key] || {};
    }

    function getUserAllowedSubjects(user) {
      const sched = getUserSchedule(user);
      const set = new Set();
      DAYS.forEach(day => {
        const entry = sched[day];
        if (Array.isArray(entry)) {
          entry.forEach(sub => { if (sub && ALLOWED_SUBJECTS.includes(sub)) set.add(sub); });
        } else if (entry && typeof entry === 'object') {
          if (Array.isArray(entry.blocks)) {
            entry.blocks.forEach(sub => { if (sub && ALLOWED_SUBJECTS.includes(sub)) set.add(sub); });
          }
          if (Array.isArray(entry.unmapped)) {
            entry.unmapped.forEach(sub => { if (sub && ALLOWED_SUBJECTS.includes(sub)) set.add(sub); });
          }
        }
      });
      return Array.from(set);
    }

    function getDayBlocksForUser(user, dayName) {
      const sched = getUserSchedule(user);
      const entry = sched[dayName];
      if (!entry) return { blocks: [null, null, null, null, null, null], unmapped: null };
      if (Array.isArray(entry)) {
        return { blocks: entry, unmapped: null };
      }
      return {
        blocks: Array.isArray(entry.blocks) ? entry.blocks : [null, null, null, null, null, null],
        unmapped: Array.isArray(entry.unmapped) ? entry.unmapped : null
      };
    }

    function getUserData(userId) {
      return {
        tasks: state.db.tasks.filter(x => x.userId === userId),
        reminders: state.db.reminders.filter(x => x.userId === userId),
        studySessions: state.db.studySessions.filter(x => x.userId === userId),
        pomodoroLogs: state.db.pomodoroLogs.filter(x => x.userId === userId),
        goals: state.db.goals.filter(x => x.userId === userId),
        events: state.db.events.filter(x => x.userId === userId),
        notifications: state.db.notifications.filter(x => x.userId === userId)
      };
    }

    function queueSyncAction(actionType, payload) {
      if (!state.isOnline) {
        state.db.syncQueue.push({
          id: 'sync_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          actionType,
          payload,
          createdAt: new Date().toISOString()
        });
        saveDB(state.db);
      }
    }

    /**
     * ============================================================================
     * MOTOR DE RECORDATORIOS Y NOTIFICACIONES REALES (SIN DUPLICADOS)
     * ============================================================================
     */
    const REMINDER_OFFSETS = [
      { id: '15m', label: '15 minutos antes', minutes: 15 },
      { id: '30m', label: '30 minutos antes', minutes: 30 },
      { id: '1h', label: '1 hora antes', minutes: 60 },
      { id: '2h', label: '2 horas antes', minutes: 120 },
      { id: '1d', label: '1 día antes', minutes: 1440 },
      { id: '2d', label: '2 días antes', minutes: 2880 },
      { id: '3d', label: '3 días antes', minutes: 4320 },
      { id: '7d', label: '1 semana antes', minutes: 10080 }
    ];

    function computeReminderTimestamp(dueDate, dueTime, offsetMinutes) {
      const dt = new Date(`${dueDate}T${dueTime || '18:00'}:00`);
      if (isNaN(dt.getTime())) return null;
      return new Date(dt.getTime() - offsetMinutes * 60000);
    }

    function syncTaskReminders(task, reminderSpecs, user) {
      // Cancelar recordatorios previos no enviados de esta tarea
      state.db.reminders = state.db.reminders.map(r => {
        if (r.taskId === task.id && r.status === 'programado') {
          return { ...r, status: 'cancelado' };
        }
        return r;
      });

      if (task.estado === 'Completada') {
        saveDB(state.db);
        return { scheduled: 0, pastSkipped: 0 };
      }

      const now = Date.now();
      let scheduled = 0;
      let pastSkipped = 0;

      // Recordatorios previos solicitados
      (reminderSpecs || []).forEach(spec => {
        let targetDate = null;
        let label = '';
        if (spec.type === 'preset') {
          const found = REMINDER_OFFSETS.find(o => o.id === spec.presetId);
          if (found) {
            targetDate = computeReminderTimestamp(task.fechaEntrega, task.horaEntrega, found.minutes);
            label = found.label;
          }
        } else if (spec.type === 'custom' && spec.customDate && spec.customTime) {
          targetDate = new Date(`${spec.customDate}T${spec.customTime}:00`);
          label = `Personalizado (${spec.customDate} ${spec.customTime})`;
        }

        if (targetDate && !isNaN(targetDate.getTime())) {
          if (targetDate.getTime() <= now) {
            pastSkipped++;
          } else {
            const uniqueKey = `${task.id}_prev_${targetDate.getTime()}`;
            const exists = state.db.reminders.some(r => r.uniqueKey === uniqueKey && r.status !== 'cancelado');
            if (!exists) {
              state.db.reminders.push({
                id: 'rem_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
                uniqueKey,
                userId: user.id,
                taskId: task.id,
                kind: 'previo',
                label,
                triggerAt: targetDate.toISOString(),
                status: 'programado',
                sentAt: null
              });
              scheduled++;
            }
          }
        }
      });

      // Aviso automático de hora límite exacta y retraso (Sección 45.3)
      const dueDt = new Date(`${task.fechaEntrega}T${task.horaEntrega}:00`);
      if (!isNaN(dueDt.getTime()) && dueDt.getTime() > now) {
        const dueKey = `${task.id}_due_${dueDt.getTime()}`;
        if (!state.db.reminders.some(r => r.uniqueKey === dueKey && r.status !== 'cancelado')) {
          state.db.reminders.push({
            id: 'rem_due_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            uniqueKey: dueKey,
            userId: user.id,
            taskId: task.id,
            kind: 'vencimiento',
            label: 'Hora límite de entrega',
            triggerAt: dueDt.toISOString(),
            status: 'programado',
            sentAt: null
          });
        }
        // Aviso único de retraso 15 minutos después si sigue pendiente
        const overdueDt = new Date(dueDt.getTime() + 15 * 60000);
        const overdueKey = `${task.id}_overdue_${overdueDt.getTime()}`;
        if (!state.db.reminders.some(r => r.uniqueKey === overdueKey && r.status !== 'cancelado')) {
          state.db.reminders.push({
            id: 'rem_ov_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
            uniqueKey: overdueKey,
            userId: user.id,
            taskId: task.id,
            kind: 'retraso',
            label: 'Tarea retrasada',
            triggerAt: overdueDt.toISOString(),
            status: 'programado',
            sentAt: null
          });
        }
      }

      saveDB(state.db);
      return { scheduled, pastSkipped };
    }

    function processDueReminders() {
      const user = getCurrentUser();
      if (!user) return;
      const now = Date.now();
      const prefs = user.preferences || getDefaultPreferences();
      let changed = false;

      // Agrupar recordatorios vencidos por tarea para evitar ráfagas si estuvo desconectado (Sección 45.3.5)
      const dueReminders = state.db.reminders.filter(
        r => r.userId === user.id && r.status === 'programado' && new Date(r.triggerAt).getTime() <= now
      );

      if (dueReminders.length === 0) return;

      const latestByTask = {};
      dueReminders.forEach(r => {
        const task = state.db.tasks.find(t => t.id === r.taskId);
        if (!task || task.estado === 'Completada') {
          r.status = 'cancelado';
          changed = true;
          return;
        }
        // Si hubo múltiples pendientes mientras estuvo cerrado, conservar solo el más reciente relevante
        if (!latestByTask[r.taskId] || new Date(r.triggerAt) > new Date(latestByTask[r.taskId].triggerAt)) {
          if (latestByTask[r.taskId]) {
            latestByTask[r.taskId].status = 'cancelado';
          }
          latestByTask[r.taskId] = r;
        } else {
          r.status = 'cancelado';
          changed = true;
        }
      });

      Object.values(latestByTask).forEach(r => {
        const task = state.db.tasks.find(t => t.id === r.taskId);
        if (!task || task.estado === 'Completada') {
          r.status = 'cancelado';
          changed = true;
          return;
        }

        if (!prefs.notifyTasks) {
          r.status = 'cancelado';
          changed = true;
          return;
        }

        r.status = 'enviado';
        r.sentAt = new Date().toISOString();
        changed = true;

        let title = 'Recordatorio de tarea';
        let body = `Materia: ${task.materia} • Tarea: ${task.titulo} (${r.label} — Entrega ${task.horaEntrega})`;
        let soundToPlay = prefs.soundReminder || 'campana';

        if (r.kind === 'vencimiento') {
          title = 'Hora de entrega de tarea';
          body = `Llegó la hora de entregar "${task.titulo}" (${task.materia}).`;
          soundToPlay = prefs.soundOverdue || 'urgente';
        } else if (r.kind === 'retraso') {
          title = 'Tarea retrasada';
          body = `La tarea "${task.titulo}" (${task.materia}) está retrasada y figura como pendiente.`;
          soundToPlay = prefs.soundOverdue || 'urgente';
        }

        // Guardar notificación en centro interno
        state.db.notifications.unshift({
          id: 'notif_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          userId: user.id,
          type: 'tarea',
          taskId: task.id,
          title,
          message: body,
          read: false,
          createdAt: new Date().toISOString()
        });

        // Reproducir sonido si está habilitado
        if (prefs.soundEnabled) {
          SoundEngine.play(soundToPlay, prefs.soundVolume ?? 0.75);
        }

        // Mostrar notificación nativa del sistema si tiene permiso concedido
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            const sysNotif = new Notification(`Mi Mundo Escolar — ${title}`, {
              body,
              tag: r.uniqueKey,
              icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231e3a8a'/%3E%3Cpath d='M32 12L10 22l22 10 22-10-22-10z' fill='%23facc15'/%3E%3C/svg%3E"
            });
            sysNotif.onclick = () => {
              window.focus();
              state.activeTab = 'tareas';
              renderApp();
            };
          } catch (e) {
            // Fallback silencioso si el SO bloquea constructor directo
          }
        }

        showToast(`🔔 ${title}: ${task.titulo}`, 'warning');
      });

      if (changed) {
        saveDB(state.db);
        renderApp();
      }
    }

    function getDefaultPreferences() {
      return {
        notifyTasks: true,
        notifyExams: true,
        notifySessions: true,
        notifyGoals: true,
        notifySystem: true,
        defaultReminder: '15m',
        soundEnabled: true,
        soundVolume: 0.8,
        soundReminder: 'campana',
        soundOverdue: 'urgente'
      };
    }

    /**
     * ============================================================================
     * TEMPORIZADOR POMODORO PRECISO (SIN BLOQUEOS NI DOBLE CONTEO)
     * ============================================================================
     */
    function loadPomodoroState() {
      const defaults = {
        status: 'preparado', // 'preparado' | 'en_marcha' | 'pausado' | 'completado'
        phase: 'estudio', // 'estudio' | 'descanso_corto' | 'descanso_largo'
        studyMinutes: 25,
        shortBreakMinutes: 5,
        longBreakMinutes: 15,
        remainingMs: 25 * 60 * 1000,
        endTimestamp: null,
        sessionStartedAt: null,
        totalPausedMs: 0,
        lastPausedAt: null,
        selectedSubject: '',
        selectedTaskId: '',
        completedCycles: 0
      };
      try {
        const raw = localStorage.getItem('mme_pomodoro_state');
        if (!raw) return defaults;
        const saved = JSON.parse(raw);
        const merged = { ...defaults, ...saved };
        // Recuperar si estaba en marcha al recargar página
        if (merged.status === 'en_marcha' && merged.endTimestamp) {
          const left = merged.endTimestamp - Date.now();
          if (left > 0) {
            merged.remainingMs = left;
          } else {
            // Finalizó mientras estaba cerrada la pestaña
            merged.remainingMs = 0;
            merged.status = 'completado';
            merged.endTimestamp = null;
          }
        }
        return merged;
      } catch (e) {
        return defaults;
      }
    }

    function savePomodoroState() {
      try {
        localStorage.setItem('mme_pomodoro_state', JSON.stringify(state.pomodoro));
      } catch (e) {}
    }

    let pomodoroIntervalId = null;

    function ensurePomodoroTicker() {
      if (pomodoroIntervalId !== null) return;
      pomodoroIntervalId = setInterval(() => {
        if (state.pomodoro.status !== 'en_marcha' || !state.pomodoro.endTimestamp) {
          clearInterval(pomodoroIntervalId);
          pomodoroIntervalId = null;
          return;
        }
        const left = state.pomodoro.endTimestamp - Date.now();
        if (left <= 0) {
          state.pomodoro.remainingMs = 0;
          completePomodoroCycle();
        } else {
          state.pomodoro.remainingMs = left;
          updatePomodoroDisplayOnly();
        }
      }, 250);
    }

    function updatePomodoroDisplayOnly() {
      const timerEl = document.getElementById('pomodoro-clock-display');
      const progressEl = document.getElementById('pomodoro-progress-bar');
      if (timerEl) {
        timerEl.textContent = formatMsToMMSS(state.pomodoro.remainingMs);
      }
      if (progressEl) {
        const totalMs = getPhaseDurationMinutes(state.pomodoro.phase) * 60 * 1000;
        const pct = totalMs > 0 ? Math.min(100, Math.max(0, ((totalMs - state.pomodoro.remainingMs) / totalMs) * 100)) : 0;
        progressEl.style.width = `${pct}%`;
      }
    }

    function getPhaseDurationMinutes(phase) {
      if (phase === 'descanso_corto') return state.pomodoro.shortBreakMinutes;
      if (phase === 'descanso_largo') return state.pomodoro.longBreakMinutes;
      return state.pomodoro.studyMinutes;
    }

    function formatMsToMMSS(ms) {
      const totalSec = Math.max(0, Math.ceil(ms / 1000));
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function startPomodoro() {
      if (state.pomodoro.status === 'en_marcha') return; // Evitar múltiples intervalos
      SoundEngine.init();
      const now = Date.now();
      if (state.pomodoro.status === 'preparado' || state.pomodoro.status === 'completado') {
        const mins = getPhaseDurationMinutes(state.pomodoro.phase);
        state.pomodoro.remainingMs = mins * 60 * 1000;
        state.pomodoro.sessionStartedAt = new Date(now).toISOString();
        state.pomodoro.totalPausedMs = 0;
        state.pomodoro.lastPausedAt = null;
      } else if (state.pomodoro.status === 'pausado' && state.pomodoro.lastPausedAt) {
        state.pomodoro.totalPausedMs += (now - state.pomodoro.lastPausedAt);
        state.pomodoro.lastPausedAt = null;
      }
      state.pomodoro.endTimestamp = now + state.pomodoro.remainingMs;
      state.pomodoro.status = 'en_marcha';
      savePomodoroState();
      ensurePomodoroTicker();
      renderApp();
    }

    function pausePomodoro() {
      if (state.pomodoro.status !== 'en_marcha') return;
      const now = Date.now();
      state.pomodoro.remainingMs = Math.max(0, state.pomodoro.endTimestamp - now);
      state.pomodoro.endTimestamp = null;
      state.pomodoro.lastPausedAt = now;
      state.pomodoro.status = 'pausado';
      if (pomodoroIntervalId !== null) {
        clearInterval(pomodoroIntervalId);
        pomodoroIntervalId = null;
      }
      savePomodoroState();
      renderApp();
    }

    function stopAndRecordPomodoro() {
      const user = getCurrentUser();
      if (!user) return;
      if (pomodoroIntervalId !== null) {
        clearInterval(pomodoroIntervalId);
        pomodoroIntervalId = null;
      }
      const p = state.pomodoro;
      if (p.phase === 'estudio' && (p.status === 'en_marcha' || p.status === 'pausado')) {
        const configuredMs = p.studyMinutes * 60 * 1000;
        const currentRemaining = p.status === 'en_marcha' && p.endTimestamp
          ? Math.max(0, p.endTimestamp - Date.now())
          : p.remainingMs;
        const studiedMs = Math.max(0, configuredMs - currentRemaining);
        const studiedMinutes = Math.floor(studiedMs / 60000);

        if (studiedMinutes >= 1) {
          recordPomodoroLog(user, {
            startedAt: p.sessionStartedAt || new Date().toISOString(),
            endedAt: new Date().toISOString(),
            configuredMinutes: p.studyMinutes,
            actualStudiedMinutes: studiedMinutes,
            pausedMinutes: Math.round(p.totalPausedMs / 60000),
            finalState: 'detenida',
            subject: p.selectedSubject || null,
            taskId: p.selectedTaskId || null
          });
          showToast(`Sesión detenida. Se registraron ${studiedMinutes} min reales de estudio.`);
        } else {
          showToast('Sesión detenida (menos de 1 minuto estudiado, no se acumula tiempo).', 'warning');
        }
      }
      resetPomodoroToPhase(p.phase, false);
    }

    function resetPomodoroToPhase(phase, askConfirm = true) {
      if (askConfirm && (state.pomodoro.status === 'en_marcha' || state.pomodoro.status === 'pausado')) {
        if (!confirm('¿Deseas reiniciar el temporizador? El tiempo no guardado de este ciclo se perderá.')) return;
      }
      if (pomodoroIntervalId !== null) {
        clearInterval(pomodoroIntervalId);
        pomodoroIntervalId = null;
      }
      state.pomodoro.phase = phase;
      state.pomodoro.status = 'preparado';
      state.pomodoro.remainingMs = getPhaseDurationMinutes(phase) * 60 * 1000;
      state.pomodoro.endTimestamp = null;
      state.pomodoro.sessionStartedAt = null;
      state.pomodoro.totalPausedMs = 0;
      state.pomodoro.lastPausedAt = null;
      savePomodoroState();
      renderApp();
    }

    function completePomodoroCycle() {
      if (pomodoroIntervalId !== null) {
        clearInterval(pomodoroIntervalId);
        pomodoroIntervalId = null;
      }
      const user = getCurrentUser();
      const p = state.pomodoro;
      p.status = 'completado';
      p.endTimestamp = null;

      if (user) {
        const prefs = user.preferences || getDefaultPreferences();
        if (prefs.soundEnabled) {
          SoundEngine.play('acorde', prefs.soundVolume ?? 0.8);
        }

        if (p.phase === 'estudio') {
          recordPomodoroLog(user, {
            startedAt: p.sessionStartedAt || new Date().toISOString(),
            endedAt: new Date().toISOString(),
            configuredMinutes: p.studyMinutes,
            actualStudiedMinutes: p.studyMinutes,
            pausedMinutes: Math.round(p.totalPausedMs / 60000),
            finalState: 'completada',
            subject: p.selectedSubject || null,
            taskId: p.selectedTaskId || null
          });
          p.completedCycles = (p.completedCycles || 0) + 1;

          state.db.notifications.unshift({
            id: 'notif_pom_' + Date.now(),
            userId: user.id,
            type: 'pomodoro',
            title: 'Ciclo Pomodoro completado',
            message: `¡Excelente! Completaste ${p.studyMinutes} minutos de estudio${p.selectedSubject ? ' en ' + p.selectedSubject : ''}.`,
            read: false,
            createdAt: new Date().toISOString()
          });
          saveDB(state.db);
          showToast(`🎉 ¡Ciclo completado! +${p.studyMinutes} min registrados en tus estadísticas.`);

          const nextPhase = (p.completedCycles % 4 === 0) ? 'descanso_largo' : 'descanso_corto';
          p.phase = nextPhase;
          p.status = 'preparado';
          p.remainingMs = getPhaseDurationMinutes(nextPhase) * 60 * 1000;
        } else {
          showToast('☕ Descanso finalizado. Listo para volver a estudiar.');
          p.phase = 'estudio';
          p.status = 'preparado';
          p.remainingMs = p.studyMinutes * 60 * 1000;
        }
      }
      savePomodoroState();
      renderApp();
    }

    function recordPomodoroLog(user, entry) {
      const logId = 'pom_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      state.db.pomodoroLogs.unshift({
        id: logId,
        userId: user.id,
        date: getTodayISO(),
        createdAt: new Date().toISOString(),
        ...entry
      });
      saveDB(state.db);
    }

    function switchAuthStep(step) {
      state.authError = '';
      state.authStep = step;
      renderApp();
    }

    function handleAuthFormSubmit(e) {
      e.preventDefault();
      const nombre = (state.authDraft.nombre || '').trim();
      const email = (state.authDraft.email || '').trim().toLowerCase();
      const curso = state.authDraft.curso;
      const paralelo = state.authDraft.paralelo;

      if (!nombre || nombre.length < 2) {
        state.authError = 'Por favor, escribe el nombre completo del estudiante.';
        renderApp();
        return;
      }
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        state.authError = 'Por favor, introduce un correo electrónico con formato válido.';
        renderApp();
        return;
      }
      if (!COURSES.includes(curso) || !PARALLELS.includes(paralelo)) {
        state.authError = 'Selecciona un curso válido (Primero a Sexto de secundaria) y un paralelo (A, B o C).';
        renderApp();
        return;
      }

      state.authDraft = { nombre, email, curso, paralelo };
      state.authError = '';
      state.authStep = 'confirm';
      renderApp();
    }

    function confirmAndEnter() {
      const { nombre, email, curso, paralelo } = state.authDraft;
      let user = state.db.users.find(u => u.email === email);

      if (user) {
        // Actualizar nombre/curso si ya existía el correo
        user.nombre = nombre;
        user.curso = curso;
        user.paralelo = paralelo;
        user.updatedAt = new Date().toISOString();
      } else {
        // Cuenta nueva completamente vacía (Sección 6)
        user = {
          id: 'usr_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          nombre,
          email,
          curso,
          paralelo,
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'America/La_Paz',
          preferences: getDefaultPreferences(),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        state.db.users.push(user);
      }

      saveDB(state.db);
      state.currentUserId = user.id;
      localStorage.setItem('mme_active_user_id', user.id);
      state.authStep = 'form';
      state.activeTab = 'inicio';
      renderApp();
      showToast(`Tu horario de ${user.curso} "${user.paralelo}" ha sido asignado correctamente.`);
    }

    function loginExistingUser(userId) {
      const user = state.db.users.find(u => u.id === userId);
      if (!user) return;
      state.currentUserId = user.id;
      localStorage.setItem('mme_active_user_id', user.id);
      state.activeTab = 'inicio';
      renderApp();
      showToast(`¡Bienvenido de nuevo, ${user.nombre}!`);
    }

    function logoutUser() {
      if (pomodoroIntervalId !== null) {
        clearInterval(pomodoroIntervalId);
        pomodoroIntervalId = null;
      }
      state.currentUserId = null;
      localStorage.removeItem('mme_active_user_id');
      state.mobileDrawerOpen = false;
      state.authStep = 'form';
      renderApp();
      showToast('Sesión cerrada de forma segura.');
    }

    function renderMainShell(user) {

      const unreadCount = data.notifications.filter(n => !n.read).length;
      const collapsed = state.sidebarCollapsed;
      const currentNavObj = [...NAV_ITEMS, ...BOTTOM_NAV_ITEMS].find(i => i.id === state.activeTab) || NAV_ITEMS[0];

      const renderNavLinks = (isMobile = false) => {
        return NAV_ITEMS.map(item => {
          const isActive = state.activeTab === item.id;
          const badge = item.id === 'notificaciones' && unreadCount > 0
            ? `<span class="ml-auto px-2 py-0.5 text-xs font-bold rounded-full ${isActive ? 'bg-amber-400 text-blue-950' : 'bg-rose-600 text-white'}">${unreadCount}</span>`
            : '';
          return `
            <button onclick="navigateTo('${item.id}')"
              title="${escapeHTML(item.label)}"
              aria-label="${escapeHTML(item.label)}"
              aria-current="${isActive ? 'page' : 'false'}"
              class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-semibold transition focus:outline-none focus:ring-2 focus:ring-blue-400
                ${isActive ? 'bg-blue-900 text-white shadow-sm' : 'text-slate-700 hover:bg-sky-50 hover:text-blue-900'}">
              <span class="shrink-0 ${isActive ? 'text-amber-300' : 'text-blue-700'}">${item.icon}</span>
              ${(!collapsed || isMobile) ? `<span class="truncate">${escapeHTML(item.label)}</span>${badge}` : ''}
              ${(collapsed && !isMobile && item.id === 'notificaciones' && unreadCount > 0) ? `<span class="w-2 h-2 rounded-full bg-rose-500 absolute right-2"></span>` : ''}
            </button>
          `;
        }).join('');
      };

      const renderBottomLinks = (isMobile = false) => {
        return BOTTOM_NAV_ITEMS.map(item => {
          const isActive = state.activeTab === item.id;
          return `
            <button onclick="navigateTo('${item.id}')"
              title="${escapeHTML(item.label)}"
              aria-label="${escapeHTML(item.label)}"
              class="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium transition focus:outline-none focus:ring-2 focus:ring-blue-400
                ${isActive ? 'bg-blue-100 text-blue-950 font-bold' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'}">
              <span class="shrink-0 text-slate-500">${item.icon}</span>
              ${(!collapsed || isMobile) ? `<span class="truncate">${escapeHTML(item.label)}</span>` : ''}
            </button>
          `;
        }).join('');
      };

      return `
        <div class="min-h-screen flex bg-slate-50 text-slate-900">
          <!-- BARRA LATERAL DESKTOP (FIJA Y COLAPSABLE) -->
          <aside aria-label="Navegación principal"
            class="hidden md:flex flex-col fixed inset-y-0 left-0 z-30 bg-white border-r border-slate-200 sidebar-transition ${collapsed ? 'w-20' : 'w-64'}">
            <div class="p-3.5 flex items-center justify-between border-b border-slate-100">
              <button onclick="navigateTo('inicio')" class="focus:outline-none">
                ${renderLogo(collapsed ? 'icon-only' : 'sm')}
              </button>
              <button onclick="toggleSidebarCollapse()"
                title="${collapsed ? 'Expandir barra lateral' : 'Contraer barra lateral'}"
                aria-label="${collapsed ? 'Expandir barra lateral' : 'Contraer barra lateral'}"
                class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-900 transition">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  ${collapsed
                    ? '<path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/>'
                    : '<path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>'}
                </svg>
              </button>
            </div>

            <div class="p-3">
              <button onclick="openTaskModal()"
                title="Crear nueva tarea"
                class="w-full flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-blue-950 font-extrabold text-sm shadow-sm transition">
                <span class="text-lg leading-none">+</span>
                ${!collapsed ? '<span>Nueva tarea</span>' : ''}
              </button>
            </div>

            <nav class="flex-1 px-3 space-y-1 overflow-y-auto scrollbar-thin">
              ${renderNavLinks(false)}
            </nav>

            <div class="p-3 border-t border-slate-100 space-y-1 bg-slate-50/60">
              ${renderBottomLinks(false)}
              ${!collapsed ? `
                <div class="mt-2 pt-2 border-t border-slate-200/70 px-2 flex items-center justify-between">
                  <div class="truncate">
                    <div class="text-xs font-bold text-slate-900 truncate">${escapeHTML(user.nombre)}</div>
                    <div class="text-[11px] font-semibold text-blue-700">${escapeHTML(user.curso)} "${escapeHTML(user.paralelo)}"</div>
                  </div>
                  <button onclick="logoutUser()" title="Cerrar sesión" class="text-xs font-semibold text-rose-600 hover:underline shrink-0 ml-2">Salir</button>
                </div>
              ` : ''}
            </div>
          </aside>

          <!-- PANEL LATERAL DESLIZABLE MÓVIL (INSPIRADO EN COMODIDAD CHATGPT) -->
          ${state.mobileDrawerOpen ? `
            <div class="fixed inset-0 z-50 md:hidden flex" role="dialog" aria-modal="true" aria-label="Menú móvil">
              <div onclick="toggleMobileDrawer(false)" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs transition-opacity"></div>
              <div class="relative w-72 max-w-[82vw] bg-white h-full shadow-2xl flex flex-col z-10 drawer-transition">
                <div class="p-4 flex items-center justify-between border-b border-slate-100">
                  ${renderLogo('sm')}
                  <button onclick="toggleMobileDrawer(false)" aria-label="Cerrar menú"
                    class="p-2 rounded-xl text-slate-500 hover:bg-slate-100">
                    ✕
                  </button>
                </div>

                <div class="p-3">
                  <button onclick="toggleMobileDrawer(false); openTaskModal()"
                    class="w-full flex items-center justify-center gap-2 py-3 px-4 rounded-xl bg-amber-500 text-blue-950 font-extrabold text-sm shadow-sm">
                    <span class="text-lg">+</span>
                    <span>Nueva tarea</span>
                  </button>
                </div>

                <nav class="flex-1 px-3 space-y-1 overflow-y-auto">
                  ${renderNavLinks(true)}
                </nav>

                <div class="p-3 border-t border-slate-100 space-y-1 bg-slate-50">
                  ${renderBottomLinks(true)}
                  <div class="pt-2 mt-2 border-t border-slate-200 flex items-center justify-between px-2">
                    <div>
                      <div class="text-xs font-bold text-slate-900">${escapeHTML(user.nombre)}</div>
                      <div class="text-[11px] text-blue-700 font-semibold">${escapeHTML(user.curso)} "${escapeHTML(user.paralelo)}"</div>
                    </div>
                    <button onclick="logoutUser()" class="px-3 py-1.5 rounded-lg bg-rose-50 text-rose-700 text-xs font-bold">Cerrar sesión</button>
                  </div>
                </div>
              </div>
            </div>
          ` : ''}

          <!-- ÁREA PRINCIPAL -->
          <div class="flex-1 flex flex-col min-w-0 sidebar-transition ${collapsed ? 'md:ml-20' : 'md:ml-64'}">
            <!-- BARRA SUPERIOR MÓVIL -->
            <header class="md:hidden sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-200 px-3 py-2.5 flex items-center justify-between gap-2">
              <button onclick="toggleMobileDrawer(true)" aria-label="Abrir menú de navegación"
                class="p-2 rounded-xl text-slate-700 hover:bg-slate-100 active:bg-slate-200">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                  <path d="M4 6h16M4 12h16M4 18h10" stroke-linecap="round"/>
                </svg>
              </button>
              <div class="font-bold text-slate-900 text-sm truncate">${escapeHTML(currentNavObj.label)}</div>
              <div class="flex items-center gap-1.5">
                <button onclick="navigateTo('notificaciones')" aria-label="Notificaciones"
                  class="relative p-2 rounded-xl text-slate-700 hover:bg-slate-100">
                  ${ICONS.notificaciones}
                  ${unreadCount > 0 ? `<span class="absolute top-1 right-1 w-4 h-4 rounded-full bg-rose-600 text-white text-[10px] font-bold flex items-center justify-center">${unreadCount}</span>` : ''}
                </button>
                <button onclick="openTaskModal()" aria-label="Nueva tarea"
                  class="px-2.5 py-1.5 rounded-xl bg-amber-500 text-blue-950 font-extrabold text-xs">
                  + Tarea
                </button>
              </div>
            </header>

            <!-- INDICADOR DE CONEXIÓN / OFFLINE -->
            ${!state.isOnline ? `
              <div class="bg-amber-600 text-white text-xs font-semibold px-4 py-2 flex items-center justify-between">
                <span>📡 Estás sin conexión a internet. Los cambios se guardan localmente en este dispositivo y se sincronizarán al reconectar (${state.db.syncQueue.length} pendientes).</span>
              </div>
            ` : ''}

            <!-- CONTENIDO DE LA SECCIÓN ACTIVA -->
            <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 lg:p-8">
              ${renderActiveSection(user, data)}
            </main>
          </div>
        </div>
        ${renderActiveModal(user, data)}
      `;
    }

    function renderActiveSection(user, data) {
      switch (state.activeTab) {
        case 'inicio': return renderDashboardSection(user, data);
        case 'horario': return renderScheduleSection(user);
        case 'tareas': return renderTasksSection(user, data);
        case 'estudio': return renderStudySessionsSection(user, data);
        case 'objetivos': return renderGoalsSection(user, data);
        case 'calendario': return renderCalendarSection(user, data);
        case 'pomodoro': return renderPomodoroSection(user, data);
        case 'estadisticas': return renderStatsSection(user, data);
        case 'notificaciones': return renderNotificationsSection(user, data);
        case 'perfil': return renderProfileSection(user);
        case 'configuracion': return renderSettingsSection(user);
        case 'admin': return renderAdminSection(user);
        default: return renderDashboardSection(user, data);
      }
    }

    /**
     * ============================================================================
     * 12. DASHBOARD (INICIO)
     * ============================================================================
     */
    function renderDashboardSection(user, data) {
      const todayName = getTodayDayName();
      const todayISO = getTodayISO();
      const { blocks: todayBlocks, unmapped: todayUnmapped } = getDayBlocksForUser(user, todayName);

      const pendingTasks = data.tasks.filter(t => t.estado !== 'Completada').sort((a, b) => `${a.fechaEntrega} ${a.horaEntrega}`.localeCompare(`${b.fechaEntrega} ${b.horaEntrega}`));
      const completedTasks = data.tasks.filter(t => t.estado === 'Completada');
      const nextTask = pendingTasks[0] || null;

      const upcomingSessions = data.studySessions.filter(s => s.fecha >= todayISO && s.estado !== 'Completada').sort((a, b) => `${a.fecha} ${a.horaInicio}`.localeCompare(`${b.fecha} ${b.horaInicio}`));
      const nextSession = upcomingSessions[0] || null;

      const totalStudiedMinutes = data.pomodoroLogs.reduce((acc, l) => acc + (l.actualStudiedMinutes || 0), 0);
      const studiedHoursText = `${Math.floor(totalStudiedMinutes / 60)}h ${totalStudiedMinutes % 60}m`;

      const completedGoals = data.goals.filter(g => g.estado === 'Completado').length;
      const weeklyProgress = data.tasks.length > 0 ? Math.round((completedTasks.length / data.tasks.length) * 100) : 0;
      const unreadNotifs = data.notifications.filter(n => !n.read);

      return `
        <div class="space-y-6">
          <!-- ENCABEZADO PERSONALIZADO -->
          <div class="bg-gradient-to-r from-blue-950 via-blue-900 to-sky-800 rounded-3xl p-6 sm:p-7 text-white shadow-lg flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/15 text-sky-100 text-xs font-bold mb-2">
                <span>🎓 Educación Secundaria • ${escapeHTML(user.curso)} "${escapeHTML(user.paralelo)}"</span>
              </div>
              <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Hola, ${escapeHTML(user.nombre)} 👋</h1>
              <p class="text-sky-100 text-sm mt-1">Hoy es <strong>${todayName}</strong> (${todayISO}). Aquí tienes tu resumen académico.</p>
            </div>
            <div class="flex flex-wrap gap-2.5">
              <button onclick="openTaskModal()" class="px-4 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-blue-950 font-extrabold text-sm shadow transition">
                + Nueva tarea
              </button>
              <button onclick="navigateTo('pomodoro')" class="px-4 py-2.5 rounded-xl bg-white/15 hover:bg-white/25 text-white font-bold text-sm backdrop-blur transition">
                ⏱️ Iniciar Pomodoro
              </button>
            </div>
          </div>

          <!-- MÉTRICAS RÁPIDAS (INICIAN EN 0 PARA CUENTA NUEVA) -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5 sm:gap-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
              <div class="text-xs font-semibold text-slate-500">Mis tareas pendientes</div>
              <div class="text-2xl font-extrabold text-blue-950 mt-1">${pendingTasks.length}</div>
              <div class="text-xs text-teal-700 font-medium mt-1">${completedTasks.length} completadas</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
              <div class="text-xs font-semibold text-slate-500">Horas estudiadas</div>
              <div class="text-2xl font-extrabold text-teal-700 mt-1">${studiedHoursText}</div>
              <div class="text-xs text-slate-500 mt-1">${data.pomodoroLogs.length} sesiones Pomodoro</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
              <div class="text-xs font-semibold text-slate-500">Progreso semanal</div>
              <div class="text-2xl font-extrabold text-amber-600 mt-1">${weeklyProgress}%</div>
              <div class="w-full bg-slate-100 h-2 rounded-full mt-2 overflow-hidden">
                <div class="bg-amber-500 h-full rounded-full" style="width: ${weeklyProgress}%"></div>
              </div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
              <div class="text-xs font-semibold text-slate-500">Mis objetivos</div>
              <div class="text-2xl font-extrabold text-violet-700 mt-1">${completedGoals}/${data.goals.length}</div>
              <div class="text-xs text-slate-500 mt-1">Alcanzados</div>
            </div>
          </div>

          <!-- GRID PRINCIPAL DEL DASHBOARD -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- COLUMNA IZQUIERDA (2/3): CLASES DE HOY + MIS TAREAS -->
            <div class="lg:col-span-2 space-y-6">
              <!-- CLASES DE HOY (DATOS ESCOLARES PRECONFIGURADOS) -->
              <section class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                  <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-md">Horario Oficial Preconfigurado</span>
                    <h2 class="text-lg font-bold text-slate-900 mt-1">Clases de hoy (${todayName})</h2>
                  </div>
                  <button onclick="navigateTo('horario')" class="text-xs font-bold text-blue-700 hover:underline">Ver horario completo →</button>
                </div>

                <div class="p-5">
                  ${todayUnmapped ? `
                    <div class="p-4 rounded-xl bg-amber-50 border border-amber-200 text-amber-950 text-sm">
                      <p class="font-bold">⚠️ Distribución de bloques pendiente de configuración oficial</p>
                      <p class="mt-1 text-xs">Las materias asignadas para este día son: <strong>${todayUnmapped.join(', ')}</strong>. El administrador puede asignar los bloques exactos en el Panel Administrativo.</p>
                    </div>
                  ` : `
                    <div class="space-y-2">
                      ${TIME_SLOTS.map(slot => {
                        if (slot.type === 'recreo') {
                          return `
                            <div class="flex items-center justify-between px-3.5 py-2 rounded-xl bg-amber-50/80 border border-amber-200/80 text-amber-900 text-xs font-bold">
                              <span>☕ ${slot.label}</span>
                              <span>${slot.start} – ${slot.end}</span>
                            </div>
                          `;
                        }
                        const subj = todayBlocks[slot.blockNum - 1];
                        if (!subj) {
                          return `
                            <div class="flex items-center justify-between px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200/60 text-slate-400 text-xs">
                              <span>${slot.label} (${slot.start} – ${slot.end})</span>
                              <span>Sin clase asignada</span>
                            </div>
                          `;
                        }
                        const sc = SUBJECT_COLORS[subj] || { bg: 'bg-blue-50', text: 'text-blue-900', border: 'border-blue-200' };
                        return `
                          <div class="flex items-center justify-between px-4 py-2.5 rounded-xl border ${sc.bg} ${sc.border}">
                            <div class="flex items-center gap-3">
                              <span class="text-xs font-bold text-slate-500 w-24 shrink-0">${slot.start}–${slot.end}</span>
                              <span class="font-bold text-sm ${sc.text}">${escapeHTML(subj)}</span>
                            </div>
                            <span class="text-[11px] font-semibold px-2 py-0.5 rounded bg-white/80 text-slate-600">${slot.label}</span>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  `}
                </div>
              </section>

              <!-- MIS TAREAS (DATOS PERSONALES DEL ESTUDIANTE) -->
              <section class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                  <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-teal-700 bg-teal-50 px-2.5 py-0.5 rounded-md">Datos Personales</span>
                    <h2 class="text-lg font-bold text-slate-900 mt-1">Mis tareas pendientes</h2>
                  </div>
                  <button onclick="navigateTo('tareas')" class="text-xs font-bold text-blue-700 hover:underline">Gestionar todas →</button>
                </div>
                <div class="p-5">
                  ${pendingTasks.length === 0 ? `
                    <div class="text-center py-8 px-4 bg-slate-50 rounded-2xl border border-dashed border-slate-300">
                      <p class="text-base font-bold text-slate-700">📚 Todavía no tienes tareas.</p>
                      <p class="text-xs text-slate-500 mt-1">Agrega tu primera tarea para comenzar a organizar tus entregas.</p>
                      <button onclick="openTaskModal()" class="mt-4 px-4 py-2 rounded-xl bg-blue-900 text-white text-xs font-bold hover:bg-blue-800">
                        + Crear tarea
                      </button>
                    </div>
                  ` : `
                    <div class="space-y-2.5">
                      ${pendingTasks.slice(0, 4).map(t => renderTaskRowCompact(t)).join('')}
                    </div>
                  `}
                </div>
              </section>
            </div>

            <!-- COLUMNA DERECHA (1/3): PRÓXIMA TAREA, PRÓXIMA SESIÓN, OBJETIVOS Y NOTIFICACIONES -->
            <div class="space-y-6">
              <!-- PRÓXIMA TAREA Y SESIÓN -->
              <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4">
                <h2 class="text-base font-bold text-slate-900">Próximas actividades</h2>

                <div class="p-3.5 rounded-xl bg-sky-50/70 border border-sky-200">
                  <div class="text-xs font-bold text-sky-900 uppercase">Próxima tarea</div>
                  ${nextTask ? `
                    <div class="font-bold text-slate-900 mt-1">${escapeHTML(nextTask.titulo)}</div>
                    <div class="text-xs text-slate-600 mt-0.5">${escapeHTML(nextTask.materia)} • Entrega: ${nextTask.fechaEntrega} ${nextTask.horaEntrega}</div>
                  ` : `
                    <p class="text-xs text-slate-500 mt-1">No tienes actividades próximas.</p>
                  `}
                </div>

                <div class="p-3.5 rounded-xl bg-teal-50/70 border border-teal-200">
                  <div class="text-xs font-bold text-teal-900 uppercase">Próxima sesión de estudio</div>
                  ${nextSession ? `
                    <div class="font-bold text-slate-900 mt-1">${escapeHTML(nextSession.materia)}</div>
                    <div class="text-xs text-slate-600 mt-0.5">${nextSession.fecha} • ${nextSession.horaInicio}–${nextSession.horaFin}</div>
                  ` : `
                    <p class="text-xs text-slate-500 mt-1">Programa tu primera sesión de estudio.</p>
                    <button onclick="navigateTo('estudio')" class="mt-2 text-xs font-bold text-teal-800 underline">Programar sesión →</button>
                  `}
                </div>
              </section>

              <!-- MIS OBJETIVOS -->
              <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
                <div class="flex items-center justify-between mb-3">
                  <h2 class="text-base font-bold text-slate-900">Mis objetivos</h2>
                  <button onclick="navigateTo('objetivos')" class="text-xs font-bold text-blue-700 hover:underline">Ver todos</button>
                </div>
                ${data.goals.length === 0 ? `
                  <div class="p-4 rounded-xl bg-slate-50 border border-dashed border-slate-300 text-center">
                    <p class="text-xs font-semibold text-slate-600">🎯 Todavía no has creado objetivos.</p>
                    <button onclick="openGoalModal()" class="mt-2.5 px-3 py-1.5 rounded-lg bg-violet-700 text-white text-xs font-bold">+ Crear objetivo</button>
                  </div>
                ` : `
                  <div class="space-y-3">
                    ${data.goals.slice(0, 3).map(g => `
                      <div class="p-3 rounded-xl border border-slate-200">
                        <div class="flex justify-between text-xs font-bold">
                          <span class="text-slate-900 truncate">${escapeHTML(g.titulo)}</span>
                          <span class="text-violet-700">${g.progreso}%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-2 rounded-full mt-1.5 overflow-hidden">
                          <div class="bg-violet-600 h-full rounded-full" style="width: ${g.progreso}%"></div>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </section>

              <!-- NOTIFICACIONES RECIENTES -->
              <section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs">
                <div class="flex items-center justify-between mb-3">
                  <h2 class="text-base font-bold text-slate-900">Notificaciones ${unreadNotifs.length > 0 ? `(${unreadNotifs.length})` : ''}</h2>
                  <button onclick="navigateTo('notificaciones')" class="text-xs font-bold text-blue-700 hover:underline">Centro 🔔</button>
                </div>
                ${data.notifications.length === 0 ? `
                  <p class="text-xs text-slate-500">Sin notificaciones pendientes.</p>
                ` : `
                  <div class="space-y-2">
                    ${data.notifications.slice(0, 3).map(n => `
                      <div class="p-2.5 rounded-xl text-xs border ${n.read ? 'bg-slate-50 border-slate-200 text-slate-600' : 'bg-amber-50 border-amber-200 text-slate-900 font-medium'}">
                        <div class="font-bold">${escapeHTML(n.title)}</div>
                        <div class="mt-0.5 line-clamp-2">${escapeHTML(n.message)}</div>
                      </div>
                    `).join('')}
                  </div>
                `}
              </section>
            </div>
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * 11. MI HORARIO (SEMANAL Y DIARIA CON RECREOS EXACTOS)
     * ============================================================================
     */
    function renderScheduleSection(user) {

        <div class="space-y-6">

                class="px-3.5 py-2 rounded-lg text-xs font-bold transition ${state.scheduleView === 'diaria' ? 'bg-blue-900 text-white shadow' : 'text-slate-600 hover:text-slate-900'}">

              </button>
            </div>
          </div>

          <!-- MATERIAS DEL CURSO -->
          <div class="bg-white p-4 rounded-2xl border border-slate-200">
            <div class="text-xs font-bold text-slate-600 mb-2">Materias oficiales de ${escapeHTML(user.curso)} "${escapeHTML(user.paralelo)}" (${allowedSubjects.length}):</div>
            <div class="flex flex-wrap gap-2">
              ${allowedSubjects.map(sub => {
                const sc = SUBJECT_COLORS[sub] || { bg: 'bg-slate-100', text: 'text-slate-800', border: 'border-slate-200' };
                return `<span class="px-3 py-1 rounded-full text-xs font-bold border ${sc.bg} ${sc.text} ${sc.border}">${escapeHTML(sub)}</span>`;
              }).join('')}

          </div>

          ${state.scheduleView === 'diaria' ? `
            <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
              <div class="flex flex-wrap gap-2">
                ${DAYS.map(d => `
                  <button onclick="state.scheduleDay = '${d}'; renderApp()"
                    class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${state.scheduleDay === d ? 'bg-blue-900 text-white' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                    ${d}
                  </button>
                `).join('')}
              </div>

              ${(() => {
                const { blocks, unmapped } = getDayBlocksForUser(user, state.scheduleDay);
                if (unmapped) {
                  return `
                    <div class="p-4 rounded-2xl bg-amber-50 border border-amber-300 text-amber-950 text-sm">
                      <div class="font-bold">⚠️ Horario del ${state.scheduleDay} con distribución sin definir en origen</div>
                      <p class="mt-1 text-xs">Las 4 materias registradas originalmente para este día son: <strong>${unmapped.join(' | ')}</strong>. No se ha inventado su ubicación por bloque. Un administrador puede configurar los bloques exactos.</p>
                    </div>
                  `;
                }
                return `
                  <div class="space-y-2.5">
                    ${TIME_SLOTS.map(slot => {
                      if (slot.type === 'recreo') {
                        return `
                          <div class="p-3 rounded-xl bg-amber-100/80 border border-amber-300 text-amber-950 font-bold text-xs flex justify-between items-center">
                            <span>☕ ${slot.label} (Descanso escolar)</span>
                            <span>${slot.start} – ${slot.end}</span>
                          </div>
                        `;
                      }
                      const subj = blocks[slot.blockNum - 1];
                      const sc = subj ? (SUBJECT_COLORS[subj] || { bg: 'bg-blue-50', text: 'text-blue-900', border: 'border-blue-200' }) : null;
                      return `
                        <div class="p-3.5 rounded-xl border ${subj ? `${sc.bg} ${sc.border}` : 'bg-slate-50 border-slate-200'} flex items-center justify-between">
                          <div>
                            <div class="text-xs font-bold text-slate-500">${slot.label} • ${slot.start} – ${slot.end}</div>
                            <div class="text-base font-extrabold ${subj ? sc.text : 'text-slate-400'} mt-0.5">${subj ? escapeHTML(subj) : 'Libre / Sin bloque'}</div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>
                `;
              })()}
            </div>
          ` : `
            <!-- VISTA SEMANAL RESPONSIVE -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[780px]">
                  <thead>
                    <tr class="bg-blue-950 text-white text-xs uppercase">
                      <th class="p-3.5 font-bold w-36">Horario</th>
                      ${DAYS.map(d => `<th class="p-3.5 font-bold">${d}</th>`).join('')}
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-200 text-xs">
                    ${TIME_SLOTS.map(slot => {
                      if (slot.type === 'recreo') {
                        return `
                          <tr class="bg-amber-50 font-bold text-amber-900">
                            <td class="p-3 whitespace-nowrap">${slot.start} – ${slot.end}</td>

                            <div class="text-[11px] font-medium text-slate-500">${slot.start} – ${slot.end}</div>
                          </td>
                          ${DAYS.map(day => {
                            const { blocks, unmapped } = getDayBlocksForUser(user, day);
                            if (unmapped && slot.blockNum === 1) {
                              return `<td rowspan="6" class="p-3 bg-amber-50/70 border-x border-amber-200 align-top">
                                <div class="font-bold text-amber-900 mb-1">Distribución sin definir</div>

                            if (!subj) return `<td class="p-3 text-slate-300 text-center">—</td>`;
                            const sc = SUBJECT_COLORS[subj] || { bg: 'bg-blue-50', text: 'text-blue-900', border: 'border-blue-200' };
                            return `
                              <td class="p-2.5">
