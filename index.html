    /**
     * ============================================================================
     * 13 - 21. SISTEMA DE TAREAS, RECORDATORIOS MÚLTIPLES Y TAREAS ATRASADAS
     * ============================================================================
     */
    function isTaskOverdue(task) {
      if (task.estado === 'Completada') return false;
      const due = new Date(`${task.fechaEntrega}T${task.horaEntrega || '23:59'}:00`);
      return !isNaN(due.getTime()) && due.getTime() < Date.now();
    }

    function renderTaskRowCompact(task) {
      const overdue = isTaskOverdue(task);
      const sc = SUBJECT_COLORS[task.materia] || { bg: 'bg-slate-100', text: 'text-slate-800', border: 'border-slate-200' };
      const reminders = state.db.reminders.filter(r => r.taskId === task.id && r.kind === 'previo' && r.status === 'programado');
      return `
        <div class="p-3.5 rounded-2xl border ${overdue ? 'border-rose-300 bg-rose-50/40' : 'border-slate-200 bg-white'} flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="space-y-1 min-w-0">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold border ${sc.bg} ${sc.text} ${sc.border}">${escapeHTML(task.materia)}</span>
              <span class="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">${escapeHTML(task.prioridad)}</span>
              ${overdue ? `<span class="text-xs font-extrabold text-rose-700 bg-rose-100 px-2 py-0.5 rounded">🔴 Tarea atrasada</span>` : ''}
              ${reminders.length > 0 ? `<span class="text-xs font-semibold text-amber-800 bg-amber-100 px-2 py-0.5 rounded">🔔 ${reminders.length} aviso(s)</span>` : ''}
            </div>
            <div class="font-bold text-slate-900 ${task.estado === 'Completada' ? 'line-through text-slate-400' : ''}">${escapeHTML(task.titulo)}</div>
            <div class="text-xs text-slate-500">Entrega: <strong>${task.fechaEntrega}</strong> a las <strong>${task.horaEntrega}</strong></div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            ${task.estado !== 'Completada' ? `
              <button onclick="completeTask('${task.id}')" class="px-3 py-1.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold">
                ✓ Completar
              </button>
            ` : `<span class="px-2.5 py-1 rounded-xl bg-teal-100 text-teal-800 text-xs font-bold">Completada</span>`}
            <button onclick="openTaskModal('${task.id}')" class="px-3 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-700 text-xs font-bold">
              Editar
            </button>
          </div>
        </div>
      `;
    }

    function renderTasksSection(user, data) {
      const allowedSubjects = getUserAllowedSubjects(user);
      let filtered = data.tasks.slice();

      if (state.taskFilterStatus !== 'todas') {
        if (state.taskFilterStatus === 'atrasadas') {
          filtered = filtered.filter(t => isTaskOverdue(t));
        } else {
          filtered = filtered.filter(t => t.estado === state.taskFilterStatus);
        }
      }
      if (state.taskFilterSubject !== 'todas') {
        filtered = filtered.filter(t => t.materia === state.taskFilterSubject);
      }
      if (state.taskSearch.trim()) {
        const q = state.taskSearch.toLowerCase();
        filtered = filtered.filter(t => t.titulo.toLowerCase().includes(q) || (t.descripcion || '').toLowerCase().includes(q));
      }

      filtered.sort((a, b) => `${a.fechaEntrega} ${a.horaEntrega}`.localeCompare(`${b.fechaEntrega} ${b.horaEntrega}`));

      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <div>
              <h1 class="text-2xl font-extrabold text-slate-900">Mis tareas</h1>
              <p class="text-xs text-slate-500 mt-0.5">Solo materias oficiales de ${escapeHTML(user.curso)} "${escapeHTML(user.paralelo)}". Con recordatorios reales y control de atrasos.</p>
            </div>
            <button onclick="openTaskModal()" class="px-4 py-2.5 rounded-xl bg-blue-900 hover:bg-blue-800 text-white font-bold text-sm shadow self-start sm:self-auto">
              + Nueva tarea
            </button>
          </div>

          <!-- BUSCADOR Y FILTROS -->
          <div class="bg-white p-4 rounded-2xl border border-slate-200 grid grid-cols-1 sm:grid-cols-3 gap-3">
            <input type="search" placeholder="Buscar tarea por título..."
              value="${escapeHTML(state.taskSearch)}"
              oninput="state.taskSearch = this.value; renderApp()"
              class="px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-blue-600 outline-none" />

            <select onchange="state.taskFilterStatus = this.value; renderApp()"
              class="px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white font-medium">
              <option value="todas" ${state.taskFilterStatus === 'todas' ? 'selected' : ''}>Todos los estados</option>
              <option value="Pendiente" ${state.taskFilterStatus === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
              <option value="En progreso" ${state.taskFilterStatus === 'En progreso' ? 'selected' : ''}>En progreso</option>
              <option value="Completada" ${state.taskFilterStatus === 'Completada' ? 'selected' : ''}>Completada</option>
              <option value="atrasadas" ${state.taskFilterStatus === 'atrasadas' ? 'selected' : ''}>🔴 Tareas atrasadas</option>
            </select>

            <select onchange="state.taskFilterSubject = this.value; renderApp()"
              class="px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white font-medium">
              <option value="todas" ${state.taskFilterSubject === 'todas' ? 'selected' : ''}>Todas mis materias</option>
              ${allowedSubjects.map(s => `<option value="${escapeHTML(s)}" ${state.taskFilterSubject === s ? 'selected' : ''}>${escapeHTML(s)}</option>`).join('')}
            </select>
          </div>

          <!-- LISTA DE TAREAS -->
          ${filtered.length === 0 ? `
            <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-10 text-center">
              <p class="text-lg font-bold text-slate-800">📚 Todavía no hay tareas en esta vista.</p>
              <p class="text-xs text-slate-500 mt-1">Crea una tarea seleccionando una de tus materias oficiales y configura sus recordatorios.</p>
              <button onclick="openTaskModal()" class="mt-4 px-5 py-2.5 rounded-xl bg-blue-900 text-white text-sm font-bold">+ Crear tarea</button>
            </div>
          ` : `
            <div class="space-y-3">
              ${filtered.map(task => {
                const overdue = isTaskOverdue(task);
                const sc = SUBJECT_COLORS[task.materia] || { bg: 'bg-slate-100', text: 'text-slate-800', border: 'border-slate-200' };
                const taskReminders = state.db.reminders.filter(r => r.taskId === task.id && r.kind === 'previo' && r.status !== 'cancelado');
                return `
                  <div class="bg-white p-5 rounded-2xl border ${overdue ? 'border-rose-300 bg-rose-50/20' : 'border-slate-200'} shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div class="space-y-1.5 flex-1">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${sc.bg} ${sc.text} ${sc.border}">${escapeHTML(task.materia)}</span>
                        <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-100 text-slate-700">Prioridad: ${escapeHTML(task.prioridad)}</span>
                        <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${task.estado === 'Completada' ? 'bg-teal-100 text-teal-800' : 'bg-blue-100 text-blue-900'}">${escapeHTML(task.estado)}</span>
                        ${overdue ? `<span class="px-2.5 py-1 rounded-lg text-xs font-extrabold bg-rose-600 text-white">🔴 Tarea atrasada</span>` : ''}
                      </div>
                      <h3 class="text-base font-extrabold text-slate-900 ${task.estado === 'Completada' ? 'line-through text-slate-400' : ''}">${escapeHTML(task.titulo)}</h3>
                      ${task.descripcion ? `<p class="text-xs text-slate-600">${escapeHTML(task.descripcion)}</p>` : ''}
                      <div class="text-xs text-slate-500 pt-1 flex flex-wrap items-center gap-3">
                        <span>📅 Entrega: <strong>${task.fechaEntrega}</strong> a las <strong>${task.horaEntrega}</strong></span>
                        ${taskReminders.length > 0 ? `
                          <span class="text-amber-800 font-semibold">🔔 Recordatorios: ${taskReminders.map(r => `${escapeHTML(r.label)} (${r.status})`).join(', ')}</span>
                        ` : ''}
                      </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-2 shrink-0">
                      ${task.estado !== 'Completada' ? `
                        <button onclick="completeTask('${task.id}')" class="px-3.5 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold">
                          ✓ Completar
                        </button>
                      ` : ''}
                      ${overdue ? `
                        <button onclick="openTaskModal('${task.id}')" class="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-blue-950 text-xs font-bold">
                          🔔 Nuevo recordatorio
                        </button>
                      ` : ''}
                      <button onclick="openTaskModal('${task.id}')" class="px-3.5 py-2 rounded-xl border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-bold">
                        Editar
                      </button>
                      <button onclick="deleteTask('${task.id}')" class="px-3.5 py-2 rounded-xl border border-rose-200 hover:bg-rose-50 text-rose-700 text-xs font-bold">
                        Eliminar
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function completeTask(taskId) {
      const task = state.db.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.estado = 'Completada';
      task.updatedAt = new Date().toISOString();
      // Cancelar recordatorios pendientes automáticamente (Sección 20)
      state.db.reminders.forEach(r => {
        if (r.taskId === taskId && r.status === 'programado') {
          r.status = 'cancelado';
        }
      });
      saveDB(state.db);
      queueSyncAction('COMPLETE_TASK', { taskId });
      renderApp();
      showToast(`Tarea "${task.titulo}" marcada como completada. Recordatorios pendientes cancelados.`);
    }

    function deleteTask(taskId) {
      const task = state.db.tasks.find(t => t.id === taskId);
      if (!task) return;
      if (!confirm(`¿Seguro que deseas eliminar la tarea "${task.titulo}"? Se cancelarán sus recordatorios asociados.`)) return;
      state.db.tasks = state.db.tasks.filter(t => t.id !== taskId);
      state.db.reminders.forEach(r => {
        if (r.taskId === taskId && r.status === 'programado') r.status = 'cancelado';
      });
      saveDB(state.db);
      queueSyncAction('DELETE_TASK', { taskId });
      renderApp();
      showToast('Tarea eliminada correctamente.');
    }

    /**
     * ============================================================================
     * 22 & 23. SESIONES DE ESTUDIO Y GENERADOR INTELIGENTE (SIN CRUCES DE CLASE)
     * ============================================================================
     */
    function isTimeOverlappingSchoolClass(user, dateISO, startTime, endTime) {
      const dt = new Date(`${dateISO}T12:00:00`);
      const map = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const dayName = map[dt.getDay()];
      if (!DAYS.includes(dayName)) return false;

      const { blocks } = getDayBlocksForUser(user, dayName);
      for (const slot of TIME_SLOTS) {
        if (slot.type === 'clase' && blocks[slot.blockNum - 1]) {
          // Verificar solapamiento [startTime, endTime) con [slot.start, slot.end)
          if (startTime < slot.end && endTime > slot.start) {
            return `${blocks[slot.blockNum - 1]} (${slot.start}–${slot.end})`;
          }
        }
      }
      return false;
    }

    function renderStudySessionsSection(user, data) {
      const sessions = data.studySessions.slice().sort((a, b) => `${a.fecha} ${a.horaInicio}`.localeCompare(`${b.fecha} ${b.horaInicio}`));
      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <div>
              <h1 class="text-2xl font-extrabold text-slate-900">Mis sesiones de estudio</h1>
              <p class="text-xs text-slate-500 mt-0.5">El sistema bloquea automáticamente cruces con tu horario escolar (13:45–18:05).</p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="openSmartScheduleModal()" class="px-4 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm shadow">
                ✨ Generador inteligente
              </button>
              <button onclick="openSessionModal()" class="px-4 py-2.5 rounded-xl bg-blue-900 hover:bg-blue-800 text-white font-bold text-sm shadow">
                + Nueva sesión
              </button>
            </div>
          </div>

          ${sessions.length === 0 ? `
            <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-10 text-center">
              <p class="text-lg font-bold text-slate-800">📖 Todavía no tienes sesiones de estudio programadas.</p>
              <p class="text-xs text-slate-500 mt-1">Crea una sesión manualmente o solicita una propuesta al Generador Inteligente según tus tareas pendientes.</p>
              <div class="mt-4 flex justify-center gap-3">
                <button onclick="openSessionModal()" class="px-4 py-2 rounded-xl bg-blue-900 text-white text-xs font-bold">+ Crear sesión</button>
                <button onclick="openSmartScheduleModal()" class="px-4 py-2 rounded-xl bg-teal-600 text-white text-xs font-bold">✨ Generar propuesta</button>
              </div>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${sessions.map(s => {
                const sc = SUBJECT_COLORS[s.materia] || { bg: 'bg-blue-50', text: 'text-blue-900', border: 'border-blue-200' };
                return `
                  <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex flex-col justify-between gap-4">
                    <div>
                      <div class="flex items-center justify-between gap-2">
                        <span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${sc.bg} ${sc.text} ${sc.border}">${escapeHTML(s.materia)}</span>
                        <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${s.estado === 'Completada' ? 'bg-teal-100 text-teal-800' : 'bg-amber-100 text-amber-900'}">${escapeHTML(s.estado)}</span>
                      </div>
                      <h3 class="text-base font-bold text-slate-900 mt-2">${escapeHTML(s.objetivo || 'Sesión de repaso')}</h3>
                      <p class="text-xs text-slate-500 mt-1">📅 ${s.fecha} • ⏰ ${s.horaInicio} – ${s.horaFin}</p>
                    </div>
                    <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
                      ${s.estado !== 'Completada' ? `
                        <button onclick="completeStudySession('${s.id}')" class="px-3 py-1.5 rounded-xl bg-teal-600 text-white text-xs font-bold">✓ Marcar realizada</button>
                      ` : ''}
                      <button onclick="deleteStudySession('${s.id}')" class="px-3 py-1.5 rounded-xl border border-rose-200 text-rose-700 text-xs font-bold ml-auto">Eliminar</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function completeStudySession(id) {
      const s = state.db.studySessions.find(x => x.id === id);
      if (!s) return;
      s.estado = 'Completada';
      saveDB(state.db);
      renderApp();
      showToast('Sesión de estudio marcada como realizada.');
    }

    function deleteStudySession(id) {
      if (!confirm('¿Eliminar esta sesión de estudio?')) return;
      state.db.studySessions = state.db.studySessions.filter(x => x.id !== id);
      saveDB(state.db);
      renderApp();
      showToast('Sesión eliminada.');
    }

    /**
     * ============================================================================
     * 25 & 44.5. MIS OBJETIVOS Y OBJETIVOS ALCANZADOS
     * ============================================================================
     */
    function renderGoalsSection(user, data) {
      const total = data.goals.length;
      const reached = data.goals.filter(g => g.estado === 'Completado').length;
      const pct = total > 0 ? Math.round((reached / total) * 100) : 0;

      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <div>
              <h1 class="text-2xl font-extrabold text-slate-900">Mis objetivos académicos</h1>
              <p class="text-xs text-slate-500 mt-0.5">Alcanzados: <strong>${reached} de ${total}</strong> (${pct}%). Solo materias de ${escapeHTML(user.curso)} "${escapeHTML(user.paralelo)}".</p>
            </div>
            <button onclick="openGoalModal()" class="px-4 py-2.5 rounded-xl bg-violet-700 hover:bg-violet-800 text-white font-bold text-sm shadow self-start sm:self-auto">
              + Nuevo objetivo
            </button>
          </div>

          ${data.goals.length === 0 ? `
            <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-10 text-center">
              <p class="text-lg font-bold text-slate-800">🎯 Todavía no tienes objetivos.</p>
              <p class="text-xs text-slate-500 mt-1">Define metas claras por materia o generales y registra tu avance real.</p>
              <button onclick="openGoalModal()" class="mt-4 px-5 py-2.5 rounded-xl bg-violet-700 text-white text-sm font-bold">+ Crear objetivo</button>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${data.goals.map(g => {
                const isDone = g.estado === 'Completado';
                return `
                  <div class="bg-white p-5 rounded-2xl border ${isDone ? 'border-teal-300 bg-teal-50/20' : 'border-slate-200'} shadow-xs space-y-3">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold bg-violet-50 text-violet-800 border border-violet-200">${escapeHTML(g.materia || 'General')}</span>
                        <h3 class="text-base font-extrabold text-slate-900 mt-1.5">${escapeHTML(g.titulo)}</h3>
                      </div>
                      <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${isDone ? 'bg-teal-600 text-white' : 'bg-amber-100 text-amber-900'}">
                        ${isDone ? '✓ Alcanzado' : escapeHTML(g.estado)}
                      </span>
                    </div>
                    ${g.descripcion ? `<p class="text-xs text-slate-600">${escapeHTML(g.descripcion)}</p>` : ''}
                    <div class="text-xs text-slate-500">
                      Fecha meta: <strong>${g.fechaObjetivo}</strong>
                      ${g.completedAt ? ` • Finalizado el <strong>${g.completedAt.split('T')[0]}</strong>` : ''}
                    </div>

                    <div>
                      <div class="flex justify-between text-xs font-bold mb-1">
                        <span>Progreso individual</span>
                        <span>${g.progreso}%</span>
                      </div>
                      <input type="range" min="0" max="100" value="${g.progreso}" ${isDone ? 'disabled' : ''}
                        onchange="updateGoalProgress('${g.id}', this.value)"
                        class="w-full accent-violet-700 cursor-pointer" />
                    </div>

                    <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
                      ${!isDone ? `
                        <button onclick="completeGoal('${g.id}')" class="px-3.5 py-1.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold">
                          ✓ Marcar alcanzado
                        </button>
                      ` : ''}
                      <button onclick="openGoalModal('${g.id}')" class="px-3 py-1.5 rounded-xl border border-slate-300 text-slate-700 text-xs font-bold">Editar</button>
                      <button onclick="deleteGoal('${g.id}')" class="px-3 py-1.5 rounded-xl border border-rose-200 text-rose-700 text-xs font-bold ml-auto">Eliminar</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function updateGoalProgress(goalId, val) {
      const g = state.db.goals.find(x => x.id === goalId);
      if (!g || g.estado === 'Completado') return;
      const num = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
      g.progreso = num;
      g.estado = num > 0 ? 'En progreso' : 'Pendiente';
      saveDB(state.db);
      renderApp();
    }

    function completeGoal(goalId) {
      const g = state.db.goals.find(x => x.id === goalId);
      if (!g) return;
      if (!confirm(`¿Confirmas que has alcanzado el objetivo "${g.titulo}"?`)) return;
      g.progreso = 100;
      g.estado = 'Completado';
      g.completedAt = new Date().toISOString();
      saveDB(state.db);
      renderApp();
      showToast(`🎯 ¡Objetivo "${g.titulo}" registrado como alcanzado!`);
    }

    function deleteGoal(goalId) {
      if (!confirm('¿Eliminar este objetivo?')) return;
      state.db.goals = state.db.goals.filter(x => x.id !== goalId);
      saveDB(state.db);
      renderApp();
      showToast('Objetivo eliminado.');
    }

    /**
     * ============================================================================
     * 24. CALENDARIO (DIARIO, SEMANAL, MENSUAL + EVENTOS PERSONALES)
     * ============================================================================
     */
    function renderCalendarSection(user, data) {
      const selDate = state.calendarDate;
      const dt = new Date(`${selDate}T12:00:00`);
      const mapDays = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const dayName = mapDays[dt.getDay()];

      const dayClasses = DAYS.includes(dayName) ? getDayBlocksForUser(user, dayName) : { blocks: [], unmapped: null };
      const dayTasks = data.tasks.filter(t => t.fechaEntrega === selDate);
      const daySessions = data.studySessions.filter(s => s.fecha === selDate);
      const dayGoals = data.goals.filter(g => g.fechaObjetivo === selDate);
      const dayEvents = data.events.filter(e => e.fecha === selDate);

      // Generar días del mes actual de selDate
      const year = dt.getFullYear();
      const month = dt.getMonth();
      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <div>
              <h1 class="text-2xl font-extrabold text-slate-900">Calendario académico</h1>
              <p class="text-xs text-slate-500 mt-0.5">Diferencia visualmente tus clases oficiales de tus tareas, sesiones, objetivos y eventos.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="openEventModal()" class="px-4 py-2 rounded-xl bg-blue-900 text-white text-xs font-bold">+ Nuevo evento</button>
              <div class="flex bg-slate-100 p-1 rounded-xl">
                ${['diario', 'semanal', 'mensual'].map(v => `
                  <button onclick="state.calendarView = '${v}'; renderApp()"
                    class="px-3 py-1.5 rounded-lg text-xs font-bold capitalize ${state.calendarView === v ? 'bg-white text-blue-900 shadow-xs' : 'text-slate-600'}">
                    ${v}
                  </button>
                `).join('')}
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- NAVEGACIÓN DE FECHA / CUADRÍCULA MENSUAL -->
            <div class="lg:col-span-2 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
              <div class="flex items-center justify-between mb-4">
                <h2 class="text-base font-extrabold text-slate-900">${monthNames[month]} ${year}</h2>
                <input type="date" value="${selDate}" onchange="state.calendarDate = this.value; renderApp()"
                  class="px-3 py-1.5 rounded-xl border border-slate-300 text-xs font-bold" />
              </div>

              ${state.calendarView === 'mensual' ? `
                <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-500 mb-2">
                  <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
                </div>
                <div class="grid grid-cols-7 gap-1.5">
                  ${Array.from({ length: firstDayOfMonth }).map(() => `<div class="h-16 sm:h-20 rounded-xl bg-slate-50/50"></div>`).join('')}
                  ${Array.from({ length: daysInMonth }).map((_, idx) => {
                    const dNum = idx + 1;
                    const iso = `${year}-${String(month + 1).padStart(2, '0')}-${String(dNum).padStart(2, '0')}`;
                    const hasTask = data.tasks.some(t => t.fechaEntrega === iso);
                    const hasSession = data.studySessions.some(s => s.fecha === iso);
                    const hasEvent = data.events.some(e => e.fecha === iso);
                    const isSelected = iso === selDate;
                    return `
                      <button onclick="state.calendarDate = '${iso}'; renderApp()"
                        class="h-16 sm:h-20 p-1.5 rounded-xl border text-left flex flex-col justify-between transition
                          ${isSelected ? 'border-blue-700 bg-blue-50 ring-2 ring-blue-200' : 'border-slate-200 hover:bg-slate-50'}">
                        <span class="text-xs font-extrabold ${isSelected ? 'text-blue-900' : 'text-slate-700'}">${dNum}</span>
                        <div class="flex flex-wrap gap-1">
                          ${hasTask ? `<span class="w-2 h-2 rounded-full bg-rose-500" title="Tarea"></span>` : ''}
                          ${hasSession ? `<span class="w-2 h-2 rounded-full bg-teal-500" title="Sesión de estudio"></span>` : ''}
                          ${hasEvent ? `<span class="w-2 h-2 rounded-full bg-amber-500" title="Evento"></span>` : ''}
                        </div>
                      </button>
                    `;
                  }).join('')}
                </div>
              ` : `
                <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600">
                  Mostrando detalle de la fecha seleccionada: <strong>${selDate} (${dayName})</strong>. Usa el selector de fecha superior para explorar cualquier día de la semana o mes.
                </div>
              `}
            </div>

            <!-- DETALLE DEL DÍA SELECCIONADO -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs space-y-4">
              <h3 class="text-base font-extrabold text-slate-900">Agenda del ${selDate} (${dayName})</h3>

              <div>
                <div class="text-xs font-bold uppercase text-blue-800 mb-1.5">🏫 Clases Oficiales</div>
                ${!DAYS.includes(dayName) ? `<p class="text-xs text-slate-400">Domingo sin clases escolares.</p>` :
                  dayClasses.unmapped ? `<p class="text-xs text-amber-800">Materias sin bloque definido: ${dayClasses.unmapped.join(', ')}</p>` : `
                  <div class="space-y-1">
                    ${TIME_SLOTS.filter(s => s.type === 'clase').map(s => {
                      const sub = dayClasses.blocks[s.blockNum - 1];
                      if (!sub) return '';
                      return `<div class="text-xs px-2.5 py-1.5 rounded-lg bg-blue-50 border border-blue-200 text-blue-950 font-semibold">${s.start}–${s.end}: ${escapeHTML(sub)}</div>`;
                    }).join('')}
                  </div>
                `}
              </div>

              <div>
                <div class="text-xs font-bold uppercase text-teal-800 mb-1.5">📌 Actividades Personales</div>
                ${(dayTasks.length + daySessions.length + dayGoals.length + dayEvents.length) === 0 ? `
                  <p class="text-xs text-slate-400">Sin tareas, sesiones ni eventos en esta fecha.</p>
                ` : `
                  <div class="space-y-1.5 text-xs">
                    ${dayTasks.map(t => `<div class="p-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-950 font-semibold">📚 Tarea: ${escapeHTML(t.titulo)} (${t.horaEntrega})</div>`).join('')}
                    ${daySessions.map(s => `<div class="p-2 rounded-lg bg-teal-50 border border-teal-200 text-teal-950 font-semibold">📖 Estudio: ${escapeHTML(s.materia)} (${s.horaInicio}–${s.horaFin})</div>`).join('')}
                    ${dayGoals.map(g => `<div class="p-2 rounded-lg bg-violet-50 border border-violet-200 text-violet-950 font-semibold">🎯 Meta: ${escapeHTML(g.titulo)}</div>`).join('')}
                    ${dayEvents.map(ev => `
                      <div class="p-2 rounded-lg bg-amber-50 border border-amber-200 text-amber-950 font-semibold flex justify-between items-center">
                        <span>🗓️ ${escapeHTML(ev.titulo)} (${ev.hora})</span>
                        <button onclick="deleteEvent('${ev.id}')" class="text-rose-600 font-bold ml-2">✕</button>
                      </div>
                    `).join('')}
                  </div>
                `}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function deleteEvent(id) {
      state.db.events = state.db.events.filter(e => e.id !== id);
      saveDB(state.db);
      renderApp();
      showToast('Evento eliminado.');
    }

    /**
     * ============================================================================
     * 26 & 44.2. TEMPORIZADOR POMODORO COMPLETO Y ESTABLE
     * ============================================================================
     */
    function renderPomodoroSection(user, data) {
      const p = state.pomodoro;
      const allowedSubjects = getUserAllowedSubjects(user);
      const pendingTasks = data.tasks.filter(t => t.estado !== 'Completada');

      const totalMs = getPhaseDurationMinutes(p.phase) * 60 * 1000;
      const pct = totalMs > 0 ? Math.min(100, Math.max(0, ((totalMs - p.remainingMs) / totalMs) * 100)) : 0;

      const phaseLabels = {
        estudio: { title: 'Sesión de Estudio', badge: 'bg-blue-900 text-white', ring: 'border-blue-600' },
        descanso_corto: { title: 'Descanso Corto', badge: 'bg-teal-600 text-white', ring: 'border-teal-500' },
        descanso_largo: { title: 'Descanso Largo', badge: 'bg-amber-500 text-blue-950', ring: 'border-amber-500' }
      };
      const statusLabels = {
        preparado: 'Preparado',
        en_marcha: 'En marcha',
        pausado: 'Pausado',
        completado: 'Completado'
      };
      const curPhase = phaseLabels[p.phase] || phaseLabels.estudio;
      const totalLoggedMin = data.pomodoroLogs.reduce((acc, l) => acc + (l.actualStudiedMinutes || 0), 0);

      return `
        <div class="max-w-3xl mx-auto space-y-6">
          <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm text-center space-y-6">
            <div class="flex flex-wrap items-center justify-center gap-2">
              <button onclick="resetPomodoroToPhase('estudio')"
                class="px-4 py-2 rounded-xl text-xs font-bold transition ${p.phase === 'estudio' ? 'bg-blue-900 text-white' : 'bg-slate-100 text-slate-700'}">
                📚 Estudio (${p.studyMinutes}m)
              </button>
              <button onclick="resetPomodoroToPhase('descanso_corto')"
                class="px-4 py-2 rounded-xl text-xs font-bold transition ${p.phase === 'descanso_corto' ? 'bg-teal-600 text-white' : 'bg-slate-100 text-slate-700'}">
                ☕ Descanso corto (${p.shortBreakMinutes}m)
              </button>
              <button onclick="resetPomodoroToPhase('descanso_largo')"
                class="px-4 py-2 rounded-xl text-xs font-bold transition ${p.phase === 'descanso_largo' ? 'bg-amber-500 text-blue-950' : 'bg-slate-100 text-slate-700'}">
                🌿 Descanso largo (${p.longBreakMinutes}m)
              </button>
            </div>

            <div class="flex items-center justify-center gap-2">
              <span class="px-3 py-1 rounded-full text-xs font-bold ${curPhase.badge}">${curPhase.title}</span>
              <span class="px-3 py-1 rounded-full text-xs font-bold bg-slate-100 text-slate-700">Estado: ${statusLabels[p.status]}</span>
            </div>

            <!-- RELOJ PRINCIPAL -->
            <div class="py-4">
              <div id="pomodoro-clock-display" class="text-6xl sm:text-7xl font-extrabold tracking-tight text-slate-900 tabular-nums">
                ${formatMsToMMSS(p.remainingMs)}
              </div>
              <div class="max-w-md mx-auto w-full bg-slate-100 h-3 rounded-full mt-4 overflow-hidden">
                <div id="pomodoro-progress-bar" class="bg-blue-700 h-full transition-all duration-200" style="width: ${pct}%"></div>
              </div>
            </div>

            <!-- VINCULAR MATERIA Y TAREA OPCIONAL -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-left max-w-xl mx-auto">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Materia a estudiar (opcional)</label>
                <select ${p.status === 'en_marcha' ? 'disabled' : ''}
                  onchange="state.pomodoro.selectedSubject = this.value; savePomodoroState()"
                  class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-semibold bg-white">
                  <option value="">-- Estudio general --</option>
                  ${allowedSubjects.map(s => `<option value="${escapeHTML(s)}" ${p.selectedSubject === s ? 'selected' : ''}>${escapeHTML(s)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Vincular tarea (opcional)</label>
                <select ${p.status === 'en_marcha' ? 'disabled' : ''}
                  onchange="state.pomodoro.selectedTaskId = this.value; savePomodoroState()"
                  class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-semibold bg-white">
                  <option value="">-- Ninguna tarea --</option>
                  ${pendingTasks.map(t => `<option value="${t.id}" ${p.selectedTaskId === t.id ? 'selected' : ''}>${escapeHTML(t.titulo)} (${escapeHTML(t.materia)})</option>`).join('')}
                </select>
              </div>
            </div>

            <!-- CONTROLES OBLIGATORIOS Y FUNCIONALES -->
            <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
              ${p.status === 'en_marcha' ? `
                <button onclick="pausePomodoro()"
                  class="px-6 py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-blue-950 font-extrabold text-sm shadow">
                  ⏸️ Pausar
                </button>
              ` : `
                <button onclick="startPomodoro()"
                  class="px-6 py-3.5 rounded-2xl bg-blue-900 hover:bg-blue-800 text-white font-extrabold text-sm shadow">
                  ▶️ ${p.status === 'pausado' ? 'Reanudar' : 'Iniciar'}
                </button>
              `}

              ${(p.status === 'en_marcha' || p.status === 'pausado') ? `
                <button onclick="stopAndRecordPomodoro()"
                  class="px-5 py-3.5 rounded-2xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm shadow">
                  ⏹️ Detener y guardar minutos
                </button>
              ` : ''}

              <button onclick="resetPomodoroToPhase(state.pomodoro.phase, true)"
                class="px-5 py-3.5 rounded-2xl border border-slate-300 hover:bg-slate-100 text-slate-700 font-bold text-sm">
                🔄 Reiniciar
              </button>
            </div>

            <!-- CONFIGURACIÓN DE DURACIONES -->
            <div class="pt-5 border-t border-slate-100 grid grid-cols-3 gap-3 max-w-md mx-auto text-left">
              <div>
                <label class="block text-[11px] font-bold text-slate-500 mb-1">Estudio (min)</label>
                <input type="number" min="1" max="120" value="${p.studyMinutes}" ${p.status === 'en_marcha' ? 'disabled' : ''}
                  onchange="updatePomodoroConfig('studyMinutes', this.value)"
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-bold text-center" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-500 mb-1">Descanso corto</label>
                <input type="number" min="1" max="30" value="${p.shortBreakMinutes}" ${p.status === 'en_marcha' ? 'disabled' : ''}
                  onchange="updatePomodoroConfig('shortBreakMinutes', this.value)"
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-bold text-center" />
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-500 mb-1">Descanso largo</label>
                <input type="number" min="5" max="60" value="${p.longBreakMinutes}" ${p.status === 'en_marcha' ? 'disabled' : ''}
                  onchange="updatePomodoroConfig('longBreakMinutes', this.value)"
                  class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm font-bold text-center" />
              </div>
            </div>
          </div>

          <!-- RESUMEN DE TIEMPO ACUMULADO REAL -->
          <div class="bg-white p-5 rounded-2xl border border-slate-200 flex items-center justify-between">
            <div>
              <div class="text-xs font-bold text-slate-500">Tiempo Pomodoro real acumulado</div>
              <div class="text-xl font-extrabold text-blue-950">${Math.floor(totalLoggedMin / 60)} horas ${totalLoggedMin % 60} minutos (${totalLoggedMin} min)</div>
            </div>
            <button onclick="navigateTo('estadisticas')" class="text-xs font-bold text-blue-700 hover:underline">Ver historial completo →</button>
          </div>
        </div>
      `;
    }

    function updatePomodoroConfig(field, rawVal) {
      const val = Math.max(1, Math.min(120, parseInt(rawVal, 10) || 25));
      state.pomodoro[field] = val;
      if (state.pomodoro.status === 'preparado') {
        state.pomodoro.remainingMs = getPhaseDurationMinutes(state.pomodoro.phase) * 60 * 1000;
      }
      savePomodoroState();
      renderApp();
    }

    /**
     * ============================================================================
     * 27 & 44.4. ESTADÍSTICAS REALES (CERO VALORES INVENTADOS)
     * ============================================================================
     */
    function renderStatsSection(user, data) {
      const todayISO = getTodayISO();
      const now = new Date();
      const sevenDaysAgo = new Date(now.getTime() - 7 * 86400000).toISOString().split('T')[0];
      const thirtyDaysAgo = new Date(now.getTime() - 30 * 86400000).toISOString().split('T')[0];

      const logs = data.pomodoroLogs;
      const totalMin = logs.reduce((acc, l) => acc + (l.actualStudiedMinutes || 0), 0);
      const todayMin = logs.filter(l => l.date === todayISO).reduce((acc, l) => acc + (l.actualStudiedMinutes || 0), 0);
      const weekMin = logs.filter(l => l.date >= sevenDaysAgo).reduce((acc, l) => acc + (l.actualStudiedMinutes || 0), 0);
      const monthMin = logs.filter(l => l.date >= thirtyDaysAgo).reduce((acc, l) => acc + (l.actualStudiedMinutes || 0), 0);

      const completedPomodoros = logs.filter(l => l.finalState === 'completada').length;
      const completedTasks = data.tasks.filter(t => t.estado === 'Completada').length;
      const completedSessions = data.studySessions.filter(s => s.estado === 'Completada').length;
      const reachedGoals = data.goals.filter(g => g.estado === 'Completado').length;
      const goalsPct = data.goals.length > 0 ? Math.round((reachedGoals / data.goals.length) * 100) : 0;

      // Desglose por materia estudiada
      const bySubject = {};
      logs.forEach(l => {
        const sub = l.subject || 'Estudio general';
        bySubject[sub] = (bySubject[sub] || 0) + (l.actualStudiedMinutes || 0);
      });
      const subjectEntries = Object.entries(bySubject).sort((a, b) => b[1] - a[1]);
      const maxSubMin = subjectEntries.length > 0 ? subjectEntries[0][1] : 1;

      return `
        <div class="space-y-6">
          <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <h1 class="text-2xl font-extrabold text-slate-900">Estadísticas reales de estudio</h1>
            <p class="text-xs text-slate-500 mt-0.5">Calculadas exclusivamente a partir de tus sesiones Pomodoro, tareas y objetivos guardados.</p>
          </div>

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-slate-500">Estudio hoy</div>
              <div class="text-2xl font-extrabold text-blue-950 mt-1">${todayMin} min</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-slate-500">Últimos 7 días</div>
              <div class="text-2xl font-extrabold text-teal-700 mt-1">${weekMin} min</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-slate-500">Últimos 30 días</div>
              <div class="text-2xl font-extrabold text-sky-700 mt-1">${monthMin} min</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-slate-500">Total acumulado</div>
              <div class="text-2xl font-extrabold text-amber-600 mt-1">${Math.floor(totalMin / 60)}h ${totalMin % 60}m</div>
            </div>
          </div>

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-slate-500">Pomodoros completados</div>
              <div class="text-xl font-extrabold text-slate-900 mt-1">${completedPomodoros}</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-slate-500">Tareas completadas</div>
              <div class="text-xl font-extrabold text-slate-900 mt-1">${completedTasks} / ${data.tasks.length}</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-slate-500">Sesiones agendadas realizadas</div>
              <div class="text-xl font-extrabold text-slate-900 mt-1">${completedSessions}</div>
            </div>
            <div class="bg-white p-4 rounded-2xl border border-slate-200">
              <div class="text-xs font-semibold text-slate-500">Objetivos alcanzados</div>
              <div class="text-xl font-extrabold text-violet-700 mt-1">${reachedGoals} / ${data.goals.length} (${goalsPct}%)</div>
            </div>
          </div>

          <!-- PROGRESO POR MATERIA -->
          <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-4">
            <h2 class="text-base font-extrabold text-slate-900">Tiempo estudiado por materia</h2>
            ${subjectEntries.length === 0 ? `
              <p class="text-xs text-slate-500 py-4">Aún no has registrado minutos de estudio con el temporizador Pomodoro. Cuando completes o detengas una sesión, aparecerá aquí.</p>
            ` : `
              <div class="space-y-3">
                ${subjectEntries.map(([sub, mins]) => `
                  <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                      <span>${escapeHTML(sub)}</span>
                      <span>${mins} min</span>
                    </div>
                    <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                      <div class="bg-blue-800 h-full rounded-full" style="width: ${Math.round((mins / maxSubMin) * 100)}%"></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>

          <!-- HISTORIAL DE SESIONES POMODORO -->
          <div class="bg-white p-5 rounded-2xl border border-slate-200 space-y-3">
            <h2 class="text-base font-extrabold text-slate-900">Historial real de sesiones Pomodoro</h2>
            ${logs.length === 0 ? `
              <p class="text-xs text-slate-500">Sin registros todavía (0 horas, 0 sesiones).</p>
            ` : `
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr class="border-b border-slate-200 text-slate-500">
                      <th class="py-2 pr-3">Fecha</th>
                      <th class="py-2 pr-3">Materia</th>
                      <th class="py-2 pr-3">Tiempo real</th>
                      <th class="py-2">Estado</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${logs.map(l => `
                      <tr>
                        <td class="py-2.5 pr-3 font-medium">${l.date}</td>
                        <td class="py-2.5 pr-3 font-bold">${escapeHTML(l.subject || 'Estudio general')}</td>
                        <td class="py-2.5 pr-3 font-extrabold text-blue-900">${l.actualStudiedMinutes} min</td>
                        <td class="py-2.5">
                          <span class="px-2 py-0.5 rounded bg-slate-100 font-semibold capitalize">${escapeHTML(l.finalState)}</span>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        </div>
      `;
    }

    /**
     * ============================================================================
     * 17. CENTRO DE NOTIFICACIONES
     * ============================================================================
     */
    function renderNotificationsSection(user, data) {
      const notifs = data.notifications;
      const unread = notifs.filter(n => !n.read).length;

      return `
        <div class="space-y-6 max-w-4xl">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-5 rounded-2xl border border-slate-200 shadow-xs">
            <div>
              <h1 class="text-2xl font-extrabold text-slate-900">Centro de notificaciones ${unread > 0 ? `(${unread})` : ''}</h1>
              <p class="text-xs text-slate-500 mt-0.5">Avisos reales de tus tareas, recordatorios y sesiones de estudio.</p>
            </div>
            ${unread > 0 ? `
              <button onclick="markAllNotificationsRead()" class="px-4 py-2 rounded-xl bg-blue-900 text-white text-xs font-bold self-start">
                ✓ Marcar todas como leídas
              </button>
            ` : ''}
          </div>

          ${notifs.length === 0 ? `
            <div class="bg-white p-10 rounded-2xl border border-dashed border-slate-300 text-center">
              <p class="text-base font-bold text-slate-700">🔔 No tienes notificaciones todavía.</p>
              <p class="text-xs text-slate-500 mt-1">Cuando configuremos recordatorios en tus tareas y llegue la hora, aparecerán aquí y sonarán según tus preferencias.</p>
            </div>
          ` : `
            <div class="space-y-2.5">
              ${notifs.map(n => `
                <div class="p-4 rounded-2xl border ${n.read ? 'bg-white border-slate-200' : 'bg-amber-50/70 border-amber-300'} flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                  <div class="space-y-1">
                    <div class="flex items-center gap-2">
                      ${!n.read ? `<span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>` : ''}
                      <span class="font-extrabold text-sm text-slate-900">${escapeHTML(n.title)}</span>
                      <span class="text-[11px] text-slate-400">${new Date(n.createdAt).toLocaleString()}</span>
                    </div>
                    <p class="text-xs text-slate-700">${escapeHTML(n.message)}</p>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                    ${n.taskId ? `
                      <button onclick="openRelatedTaskFromNotification('${n.id}', '${n.taskId}')" class="px-3 py-1.5 rounded-xl bg-blue-900 text-white text-xs font-bold">
                        Ver tarea
                      </button>
                    ` : ''}
                    ${!n.read ? `
                      <button onclick="markNotificationRead('${n.id}')" class="px-3 py-1.5 rounded-xl border border-slate-300 text-slate-700 text-xs font-bold">
                        Marcar leída
                      </button>
                    ` : ''}
                    <button onclick="deleteNotification('${n.id}')" class="px-2.5 py-1.5 rounded-xl text-rose-600 hover:bg-rose-50 text-xs font-bold">
                      Eliminar
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function markNotificationRead(id) {
      const n = state.db.notifications.find(x => x.id === id);
      if (n) n.read = true;
      saveDB(state.db);
      renderApp();
    }

    function markAllNotificationsRead() {
      const user = getCurrentUser();
      if (!user) return;
      state.db.notifications.forEach(n => { if (n.userId === user.id) n.read = true; });
      saveDB(state.db);
      renderApp();
      showToast('Todas las notificaciones marcadas como leídas.');
    }

    function deleteNotification(id) {
      state.db.notifications = state.db.notifications.filter(n => n.id !== id);
      saveDB(state.db);
      renderApp();
    }

    function openRelatedTaskFromNotification(notifId, taskId) {
      markNotificationRead(notifId);
      const exists = state.db.tasks.some(t => t.id === taskId);
      if (exists) {
        state.activeTab = 'tareas';
        openTaskModal(taskId);
      } else {
        showToast('La tarea asociada fue eliminada anteriormente.', 'warning');
      }
    }

    /**
     * ============================================================================
     * 29. PERFIL DEL ESTUDIANTE (CORREO PRIVADO Y CAMBIO DE CURSO)
     * ============================================================================
     */
    function renderProfileSection(user) {
      return `
        <div class="max-w-2xl space-y-6">
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-5">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 rounded-2xl bg-blue-900 text-white font-extrabold text-xl flex items-center justify-center">
                ${escapeHTML(user.nombre.charAt(0).toUpperCase())}
              </div>
              <div>
                <h1 class="text-xl font-extrabold text-slate-900">${escapeHTML(user.nombre)}</h1>
                <p class="text-xs font-bold text-blue-700">${escapeHTML(user.curso)} "${escapeHTML(user.paralelo)}" • Educación Secundaria</p>
              </div>
            </div>

            <form onsubmit="handleUpdateProfile(event)" class="space-y-4 pt-4 border-t border-slate-100">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Nombre del estudiante</label>
                <input id="prof-nombre" type="text" required value="${escapeHTML(user.nombre)}"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-medium" />
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Correo electrónico (privado)</label>
                <input type="email" disabled value="${escapeHTML(user.email)}"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-500 text-sm" />
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Curso</label>
                  <select id="prof-curso" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-medium">
                    ${COURSES.map(c => `<option value="${c}" ${user.curso === c ? 'selected' : ''}>${c} de secundaria</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Paralelo</label>
                  <select id="prof-paralelo" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-medium">
                    ${PARALLELS.map(p => `<option value="${p}" ${user.paralelo === p ? 'selected' : ''}>Paralelo ${p}</option>`).join('')}
                  </select>
                </div>
              </div>

              <div class="text-xs text-slate-500">
                Zona horaria detectada: <strong>${escapeHTML(user.timezone)}</strong> • Fecha de registro: <strong>${new Date(user.createdAt).toLocaleDateString()}</strong>
              </div>

              <div class="flex items-center justify-between pt-2">
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-900 hover:bg-blue-800 text-white text-sm font-bold">
                  Guardar cambios
                </button>
                <button type="button" onclick="logoutUser()" class="px-4 py-2.5 rounded-xl border border-rose-200 text-rose-700 text-xs font-bold hover:bg-rose-50">
                  Cerrar sesión
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function handleUpdateProfile(e) {
      e.preventDefault();
      const user = getCurrentUser();
      if (!user) return;
      const nombre = document.getElementById('prof-nombre').value.trim();
      const curso = document.getElementById('prof-curso').value;
      const paralelo = document.getElementById('prof-paralelo').value;

      if (!nombre) {
        showToast('El nombre no puede estar vacío.', 'error');
        return;
      }
      user.nombre = nombre;
      user.curso = curso;
      user.paralelo = paralelo;
      user.updatedAt = new Date().toISOString();
      saveDB(state.db);
      renderApp();
      showToast(`Perfil actualizado. Horario asignado: ${curso} "${paralelo}".`);
    }

    /**
     * ============================================================================
     * 18, 19, 42 & 45. CONFIGURACIÓN DE NOTIFICACIONES, SONIDO Y PERMISOS REALES
     * ============================================================================
     */
    function renderSettingsSection(user) {
      const prefs = user.preferences || getDefaultPreferences();
      const notifSupport = 'Notification' in window;
      const permState = notifSupport ? Notification.permission : 'unsupported';

      const permBadge = {
        granted: '<span class="px-2.5 py-1 rounded-lg bg-teal-100 text-teal-800 text-xs font-bold">✅ Activadas en el navegador</span>',
        denied: '<span class="px-2.5 py-1 rounded-lg bg-rose-100 text-rose-800 text-xs font-bold">🚫 Permiso denegado</span>',
        default: '<span class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 text-xs font-bold">⏳ Pendientes de configurar</span>',
        unsupported: '<span class="px-2.5 py-1 rounded-lg bg-slate-200 text-slate-700 text-xs font-bold">⚠️ No compatibles en este navegador</span>'
      }[permState];

      return `
        <div class="max-w-3xl space-y-6">
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-5">
            <div>
              <h1 class="text-2xl font-extrabold text-slate-900">Configuración de notificaciones y sonido</h1>
              <p class="text-xs text-slate-500 mt-0.5">Gestiona permisos del sistema, sonidos reales y recordatorios predeterminados.</p>
            </div>

            <!-- ESTADO REAL DE PERMISOS DEL SISTEMA -->
            <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="text-sm font-bold text-slate-900">Notificaciones del sistema (estilo WhatsApp)</span>
                ${permBadge}
              </div>
              <p class="text-xs text-slate-600 leading-relaxed">
                Para recibir avisos en la barra de notificaciones de tu computadora o celular mientras la aplicación está abierta, autoriza los permisos del navegador.
              </p>
              ${permState === 'default' ? `
                <button onclick="requestSystemNotificationPermission()" class="px-4 py-2 rounded-xl bg-blue-900 text-white text-xs font-bold">
                  🔔 Activar notificaciones del sistema
                </button>
              ` : permState === 'denied' ? `
                <div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-900 text-xs">
                  El permiso fue bloqueado en tu navegador. Haz clic en el icono de candado/ajustes junto a la barra de direcciones, cambia <strong>Notificaciones</strong> a <strong>Permitir</strong> y recarga la página.
                </div>
              ` : ''}

              <div class="p-3 rounded-xl bg-blue-50/70 border border-blue-200 text-blue-950 text-xs leading-relaxed">
                <strong>Sobre avisos con la aplicación cerrada y en iPhone:</strong>
                <ul class="list-disc pl-4 mt-1 space-y-1">
                  <li><strong>En segundo plano / cerrada:</strong> Los avisos automáticos con la app completamente cerrada requieren un servidor Push VAPID activo y conexión a internet. Mientras la página o PWA esté abierta o en segundo plano activo, el motor local dispara tus avisos con sonido al instante.</li>
                  <li><strong>En iPhone (iOS):</strong> Debes pulsar <em>Compartir → Agregar a pantalla de inicio</em> e iniciar Mi Mundo Escolar desde ese icono para que iOS habilite las notificaciones web (iOS 16.4+).</li>
                </ul>
              </div>
            </div>

            <!-- SONIDO REAL Y PRUEBA -->
            <div class="space-y-4 pt-2">
              <div class="flex items-center justify-between">
                <div>
                  <div class="text-sm font-bold text-slate-900">Sonido en recordatorios</div>
                  <div class="text-xs text-slate-500">Reproduce el tono seleccionado cuando vence un recordatorio (respeta el modo silencio del dispositivo).</div>
                </div>
                <input type="checkbox" ${prefs.soundEnabled ? 'checked' : ''}
                  onchange="updateUserPreference('soundEnabled', this.checked)"
                  class="w-5 h-5 accent-blue-900 cursor-pointer" />
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Sonido para recordatorios previos</label>
                  <select onchange="updateUserPreference('soundReminder', this.value)"
                    class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-xs font-bold">
                    <option value="campana" ${prefs.soundReminder === 'campana' ? 'selected' : ''}>Campana escolar</option>
                    <option value="acorde" ${prefs.soundReminder === 'acorde' ? 'selected' : ''}>Acorde armónico</option>
                    <option value="urgente" ${prefs.soundReminder === 'urgente' ? 'selected' : ''}>Timbre doble alerta</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Sonido para vencimiento / retraso</label>
                  <select onchange="updateUserPreference('soundOverdue', this.value)"
                    class="w-full px-3 py-2.5 rounded-xl border border-slate-300 bg-white text-xs font-bold">
                    <option value="urgente" ${prefs.soundOverdue === 'urgente' ? 'selected' : ''}>Timbre doble alerta</option>
                    <option value="campana" ${prefs.soundOverdue === 'campana' ? 'selected' : ''}>Campana escolar</option>
                    <option value="acorde" ${prefs.soundOverdue === 'acorde' ? 'selected' : ''}>Acorde armónico</option>
                  </select>
                </div>
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Volumen de aviso (${Math.round((prefs.soundVolume ?? 0.8) * 100)}%)</label>
                <input type="range" min="0" max="1" step="0.05" value="${prefs.soundVolume ?? 0.8}"
                  onchange="updateUserPreference('soundVolume', parseFloat(this.value))"
                  class="w-full accent-blue-900" />
              </div>

              <div class="flex flex-wrap gap-2">
                <button type="button" onclick="testNotificationSound()"
                  class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-blue-950 text-xs font-extrabold">
                  🔊 Probar sonido ahora
                </button>
                <button type="button" onclick="restoreDefaultSound()"
                  class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 text-xs font-bold">
                  Restaurar sonido predeterminado
                </button>
              </div>
            </div>

            <!-- RECORDATORIO PREDETERMINADO PARA NUEVAS TAREAS -->
            <div class="pt-4 border-t border-slate-100 space-y-3">
              <div>
                <label class="block text-sm font-bold text-slate-900 mb-1">Recordatorio predeterminado para nuevas tareas</label>
                <select onchange="updateUserPreference('defaultReminder', this.value)"
                  class="w-full sm:w-72 px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-xs font-bold">
                  <option value="none" ${prefs.defaultReminder === 'none' ? 'selected' : ''}>Desactivado</option>
                  ${REMINDER_OFFSETS.map(o => `<option value="${o.id}" ${prefs.defaultReminder === o.id ? 'selected' : ''}>${o.label}</option>`).join('')}
                </select>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pt-2 text-xs font-semibold text-slate-700">
                <label class="flex items-center gap-2">
                  <input type="checkbox" ${prefs.notifyTasks ? 'checked' : ''} onchange="updateUserPreference('notifyTasks', this.checked)" class="accent-blue-900" />
                  Recordatorios de tareas
                </label>
                <label class="flex items-center gap-2">
                  <input type="checkbox" ${prefs.notifySessions ? 'checked' : ''} onchange="updateUserPreference('notifySessions', this.checked)" class="accent-blue-900" />
                  Recordatorios de sesiones
                </label>
                <label class="flex items-center gap-2">
                  <input type="checkbox" ${prefs.notifyGoals ? 'checked' : ''} onchange="updateUserPreference('notifyGoals', this.checked)" class="accent-blue-900" />
                  Recordatorios de objetivos
                </label>
                <label class="flex items-center gap-2">
                  <input type="checkbox" ${prefs.notifySystem ? 'checked' : ''} onchange="updateUserPreference('notifySystem', this.checked)" class="accent-blue-900" />
                  Notificaciones del sistema
                </label>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function updateUserPreference(key, value) {
      const user = getCurrentUser();
      if (!user) return;
      if (!user.preferences) user.preferences = getDefaultPreferences();
      user.preferences[key] = value;
      saveDB(state.db);
      renderApp();
      showToast('Preferencia guardada.');
    }

    function requestSystemNotificationPermission() {
      if (!('Notification' in window)) {
        showToast('Este navegador no soporta la API de notificaciones.', 'error');
        return;
      }
      Notification.requestPermission().then(perm => {
        renderApp();
        if (perm === 'granted') {
          SoundEngine.play('campana', 0.7);
          showToast('¡Permiso concedido! Ahora recibirás notificaciones del sistema.');
        } else {
          showToast('Permiso no concedido.', 'warning');
        }
      });
    }

    function testNotificationSound() {
      const user = getCurrentUser();
      const prefs = (user && user.preferences) || getDefaultPreferences();
      const ok = SoundEngine.play(prefs.soundReminder || 'campana', prefs.soundVolume ?? 0.8);
      if (ok) {
        showToast('🔊 Reproduciendo sonido de notificación configurado.');
      } else {
        showToast('No se pudo reproducir el audio. Verifica que el dispositivo no esté silenciado.', 'error');
      }
    }

    function restoreDefaultSound() {
      updateUserPreference('soundReminder', 'campana');
      updateUserPreference('soundOverdue', 'urgente');

    function unlockAdminPanel(e) {
      e.preventDefault();
      const val = document.getElementById('admin-code-input').value.trim();
      if (val === 'ADMIN2026') {
        state.adminUnlocked = true;
        renderApp();
        showToast('Acceso administrativo concedido.');
      } else {
        showToast('Código administrativo incorrecto.', 'error');
      }
    }

    function adminUpdateBlock(groupKey, day, blockIdx, subjectVal) {
      const sched = state.db.schedules[groupKey];
      if (!sched) return;
      let current = sched[day];
      let blocks = Array.isArray(current) ? [...current] : (current && current.blocks ? [...current.blocks] : [null, null, null, null, null, null]);
      blocks[blockIdx] = subjectVal || null;
      sched[day] = blocks;
      saveDB(state.db);
      renderApp();
      showToast(`Bloque ${blockIdx + 1} del ${day} actualizado.`);
    }

    function openTaskModal(taskId = null) {
      const user = getCurrentUser();
      const prefs = (user && user.preferences) || getDefaultPreferences();
      const existing = taskId ? state.db.tasks.find(t => t.id === taskId) : null;
      const allowed = getUserAllowedSubjects(user);

      let initialReminders = [];
      if (existing) {
        const rems = state.db.reminders.filter(r => r.taskId === existing.id && r.kind === 'previo' && r.status === 'programado');
        initialReminders = rems.map(r => {
          const foundPreset = REMINDER_OFFSETS.find(o => o.label === r.label);
          if (foundPreset) return { type: 'preset', presetId: foundPreset.id };
          const d = new Date(r.triggerAt);
          return {
            type: 'custom',
            customDate: d.toISOString().split('T')[0],
            customTime: `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`
          };
        });
      } else if (prefs.defaultReminder && prefs.defaultReminder !== 'none') {
        initialReminders = [{ type: 'preset', presetId: prefs.defaultReminder }];
      }

      state.modal = {
        type: 'task',
        taskId,
        draft: {
          titulo: existing ? existing.titulo : '',
          materia: existing ? existing.materia : (allowed[0] || ''),
          descripcion: existing ? existing.descripcion : '',
          fechaEntrega: existing ? existing.fechaEntrega : getTodayISO(),
          horaEntrega: existing ? existing.horaEntrega : '18:00',
          prioridad: existing ? existing.prioridad : 'Media',
          estado: existing ? existing.estado : 'Pendiente',
          remindersActive: initialReminders.length > 0,
          reminders: initialReminders
        }
      };
      renderApp();
    }
