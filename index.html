                  Analiza tus tareas pendientes más urgentes y propone una sesión en un horario libre, respetando tus clases escolares (13:45–18:05).
                </p>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Fecha deseada</label>
                  <input type="date" required value="${d.fecha}" onchange="state.modal.draft.fecha = this.value"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div class="grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Hora libre inicial</label>
                    <input type="time" required value="${d.horaDisponibleInicio}" onchange="state.modal.draft.horaDisponibleInicio = this.value"
                      class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Duración (minutos)</label>
                    <select onchange="state.modal.draft.duracionMinutos = parseInt(this.value, 10)"
                      class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-bold">
                      <option value="30" ${d.duracionMinutos === 30 ? 'selected' : ''}>30 minutos</option>
                      <option value="45" ${d.duracionMinutos === 45 ? 'selected' : ''}>45 minutos</option>
                      <option value="60" ${d.duracionMinutos === 60 ? 'selected' : ''}>60 minutos</option>
                      <option value="90" ${d.duracionMinutos === 90 ? 'selected' : ''}>90 minutos</option>
                    </select>
                  </div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                  <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold">Cancelar</button>
                  <button type="submit" class="px-5 py-2 rounded-xl bg-teal-600 text-white text-xs font-bold">Generar sesión ahora</button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      return '';
    }

    // Acciones de formularios de modales
    function toggleDraftReminders() {
      const d = state.modal.draft;
      d.remindersActive = !d.remindersActive;
      if (d.remindersActive && d.reminders.length === 0) {
        d.reminders.push({ type: 'preset', presetId: '15m' });
      }
      renderApp();
    }

    function addDraftReminder() {
      state.modal.draft.reminders.push({ type: 'preset', presetId: '1h' });
      renderApp();
    }

    function removeDraftReminder(idx) {
      state.modal.draft.reminders.splice(idx, 1);
      if (state.modal.draft.reminders.length === 0) {
        state.modal.draft.remindersActive = false;
      }
      renderApp();
    }

    function updateDraftReminderType(idx, val) {
      if (val === 'custom') {
        state.modal.draft.reminders[idx] = {
          type: 'custom',
          customDate: state.modal.draft.fechaEntrega,
          customTime: '17:00'
        };
      } else {
        state.modal.draft.reminders[idx] = { type: 'preset', presetId: val };
      }
      renderApp();
    }

    function saveTaskFromModal(e) {
      e.preventDefault();
      const user = getCurrentUser();
      if (!user) return;
      const d = state.modal.draft;
      const allowed = getUserAllowedSubjects(user);

      if (!d.titulo.trim()) {
        showToast('El título de la tarea es obligatorio.', 'error');
        return;
      }
      if (!allowed.includes(d.materia)) {
        showToast('Selecciona una materia válida de tu horario oficial.', 'error');
        return;
      }

      let taskObj = null;
      if (state.modal.taskId) {
        taskObj = state.db.tasks.find(t => t.id === state.modal.taskId);
        if (taskObj) {
          taskObj.titulo = d.titulo.trim();
          taskObj.materia = d.materia;
          taskObj.descripcion = d.descripcion.trim();
          taskObj.fechaEntrega = d.fechaEntrega;
          taskObj.horaEntrega = d.horaEntrega;
          taskObj.prioridad = d.prioridad;
          taskObj.updatedAt = new Date().toISOString();
        }
      } else {
        taskObj = {
          id: 'tsk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          userId: user.id,
          titulo: d.titulo.trim(),
          materia: d.materia,
          descripcion: d.descripcion.trim(),
          fechaEntrega: d.fechaEntrega,
          horaEntrega: d.horaEntrega,
          prioridad: d.prioridad,
          estado: 'Pendiente',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString()
        };
        state.db.tasks.unshift(taskObj);
      }

      const remResult = syncTaskReminders(taskObj, d.remindersActive ? d.reminders : [], user);
      saveDB(state.db);
      queueSyncAction('SAVE_TASK', { taskId: taskObj.id });
      closeModal();

      let msg = `Tarea "${taskObj.titulo}" guardada.`;
      if (remResult.scheduled > 0) msg += ` ${remResult.scheduled} recordatorio(s) programado(s).`;
      if (remResult.pastSkipped > 0) msg += ` (${remResult.pastSkipped} recordatorio(s) omitidos porque su hora ya pasó).`;
      showToast(msg);
    }

    function saveGoalFromModal(e) {
      e.preventDefault();
      const user = getCurrentUser();
      if (!user) return;
      const d = state.modal.draft;
      if (!d.titulo.trim()) return;

      if (state.modal.goalId) {
        const g = state.db.goals.find(x => x.id === state.modal.goalId);
        if (g) {
          g.titulo = d.titulo.trim();
          g.materia = d.materia;
          g.descripcion = d.descripcion.trim();
          g.fechaObjetivo = d.fechaObjetivo;
        }
      } else {
        state.db.goals.unshift({
          id: 'goal_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          userId: user.id,
          titulo: d.titulo.trim(),
          materia: d.materia,
          descripcion: d.descripcion.trim(),
          fechaObjetivo: d.fechaObjetivo,
          progreso: 0,
          estado: 'Pendiente',
          completedAt: null
        });
      }
      saveDB(state.db);
      closeModal();
      showToast('Objetivo guardado correctamente.');
    }

    function saveSessionFromModal(e) {
      e.preventDefault();
      const user = getCurrentUser();
      if (!user) return;
      const d = state.modal.draft;
      if (d.horaFin <= d.horaInicio) {
        showToast('La hora final debe ser posterior a la hora inicial.', 'error');
        return;
      }
      const overlap = isTimeOverlappingSchoolClass(user, d.fecha, d.horaInicio, d.horaFin);
      if (overlap) {
        showToast(`No puedes programar estudio durante clases escolares: ${overlap}.`, 'error');
        return;
      }
      state.db.studySessions.unshift({
        id: 'ses_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        userId: user.id,
        materia: d.materia,
        fecha: d.fecha,
        horaInicio: d.horaInicio,
        horaFin: d.horaFin,
        objetivo: d.objetivo.trim() || 'Sesión de estudio personal',
        estado: 'Programada'
      });
      saveDB(state.db);
      closeModal();
      showToast('Sesión de estudio programada sin cruces de horario.');
    }

    function saveEventFromModal(e) {
      e.preventDefault();
      const user = getCurrentUser();
      if (!user) return;
      const d = state.modal.draft;
      state.db.events.unshift({
        id: 'evt_' + Date.now(),
        userId: user.id,
        titulo: d.titulo.trim(),
        fecha: d.fecha,
        hora: d.hora
      });
      saveDB(state.db);
      closeModal();
      showToast('Evento agregado al calendario.');
    }

    function runSmartScheduleGenerator(e) {
      e.preventDefault();
      const user = getCurrentUser();
      if (!user) return;
      const d = state.modal.draft;
      const allowed = getUserAllowedSubjects(user);
      const pendingTasks = dataTasksSortedByUrgency(user.id);

      const chosenSubject = pendingTasks.length > 0 ? pendingTasks[0].materia : (allowed[0] || 'Matemática');
      const goalText = pendingTasks.length > 0 ? `Preparar tarea: ${pendingTasks[0].titulo}` : `Repaso planificado de ${chosenSubject}`;

      const [hh, mm] = d.horaDisponibleInicio.split(':').map(Number);
      const startTotalMin = hh * 60 + mm;
      const endTotalMin = startTotalMin + d.duracionMinutos;
      const endHH = String(Math.floor(endTotalMin / 60) % 24).padStart(2, '0');
      const endMM = String(endTotalMin % 60).padStart(2, '0');
      const horaFin = `${endHH}:${endMM}`;

      const overlap = isTimeOverlappingSchoolClass(user, d.fecha, d.horaDisponibleInicio, horaFin);
      if (overlap) {
        showToast(`El horario elegido choca con tu clase de ${overlap}. Elige una hora fuera de clases (por ejemplo después de las 18:15 o en la mañana).`, 'error');
        return;
      }

      state.db.studySessions.unshift({
        id: 'ses_smart_' + Date.now(),
        userId: user.id,
        materia: chosenSubject,
        fecha: d.fecha,
        horaInicio: d.horaDisponibleInicio,
        horaFin,
        objetivo: goalText,
        estado: 'Programada'
      });
      saveDB(state.db);
      closeModal();
      showToast(`✨ Propuesta generada: ${chosenSubject} de ${d.horaDisponibleInicio} a ${horaFin}.`);
    }

    function dataTasksSortedByUrgency(userId) {
      const prioWeight = { 'Urgente': 1, 'Alta': 2, 'Media': 3, 'Baja': 4 };
      return state.db.tasks
        .filter(t => t.userId === userId && t.estado !== 'Completada')
        .sort((a, b) => {
          const dCmp = `${a.fechaEntrega} ${a.horaEntrega}`.localeCompare(`${b.fechaEntrega} ${b.horaEntrega}`);
          if (dCmp !== 0) return dCmp;
          return (prioWeight[a.prioridad] || 3) - (prioWeight[b.prioridad] || 3);
        });
    }

    /**
     * ============================================================================
     * INICIALIZACIÓN, PWA DINÁMICO Y CICLO PRINCIPAL DE RENDERIZADO
     * ============================================================================
     */
    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;
      const user = getCurrentUser();
      if (!user) {
        root.innerHTML = renderAuthScreen();
      } else {
        root.innerHTML = renderMainShell(user);
      }
    }

    // Registrar Service Worker dinámico para soporte PWA / Caché Offline
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      const swCode = `
        const CACHE_NAME = 'mi-mundo-escolar-v1';
        self.addEventListener('install', e => {
          self.skipWaiting();
        });
        self.addEventListener('activate', e => {
          e.waitUntil(self.clients.claim());
        });
        self.addEventListener('fetch', e => {
          if (e.request.method !== 'GET') return;
          e.respondWith(
            fetch(e.request).catch(() => caches.match(e.request))
          );
        });
        self.addEventListener('notificationclick', e => {
          e.notification.close();
          e.waitUntil(
            clients.matchAll({ type: 'window', includeUncontrolled: true }).then(list => {
              if (list.length > 0) return list[0].focus();
              return clients.openWindow('/');
            })
          );
        });
      `;
      try {
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      } catch (e) {}
    }

    // Escuchar estado online / offline
    window.addEventListener('online', () => {
      state.isOnline = true;
      if (state.db.syncQueue.length > 0) {
        const count = state.db.syncQueue.length;
        state.db.syncQueue = [];
        saveDB(state.db);
        showToast(`Conexión recuperada. ${count} cambio(s) sincronizados.`);
      }
      renderApp();
    });

    window.addEventListener('offline', () => {
      state.isOnline = false;
      renderApp();
    });

    // Arrancar verificación periódica de recordatorios vencidos y ticker Pomodoro
    setInterval(processDueReminders, 5000);
    if (state.pomodoro.status === 'en_marcha') {
      ensurePomodoroTicker();
    }

    // Render inicial
    renderApp();
    processDueReminders();
  </script>
</body>
</html>
